  $("out").onclick = () => fb.auth().signOut();

  numIn("f", "from"); numIn("t", "to"); numIn("qty", "qty");
  ["f", "t"].forEach(id => { const el = $(id); if (el) el.addEventListener("input", () => { S.byKd = false; S.kf = S.kt = ""; }); });   // בלי רינדור — כדי לא לאבד את הפוקוס בין השדות

/* רענון בלי לקטוע הקלדה: אם המפקח באמצע שדה — מחכים שיצא ממנו */
let later = false;
const VER = "2026-10-09b";
const fail = (title, detail = "") => { app.innerHTML = `<div class="card"><b>${esc(title)}</b>${detail ? `<div class="small" style="margin-top:6px;color:#666;direction:ltr;text-align:left;word-break:break-word">${esc(detail)}</div>` : ""}
  <div class="row" style="margin-top:12px;gap:8px"><button class="btn" onclick="location.reload()">לנסות שוב</button><button class="btn ghost" onclick="try{firebase.auth().signOut()}catch(e){};setTimeout(()=>location.reload(),300)">התנתקות</button></div>
  <div class="small" style="margin-top:10px;color:#999">גרסה ${VER}</div></div>`; };
const safeView = () => { try { view(); } catch (e) { console.error(e); fail("שגיאה בהצגת הדף", (e && e.message || e) + ""); } };
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms))]);

(async () => {

  try {
    await withTimeout(loadScript(base + "firebase-app-compat.js"), 20000);

  } catch (e) { return fail("לא ניתן להתחבר לשרת (Firebase)", "בדוק חיבור לאינטרנט. אם יש חוסם פרסומות / VPN / סינון תוכן באייפד — לכבות ולנסות שוב."); }

    clearTimeout(bootTimer);
    let hung = false; const db = fb.database(), acc = await withTimeout(db.ref(`${ROOT}/tableConfig/inspectorAccess/${emailKey(u.email)}`).get(), 15000).catch(e => { hung = !!(e && e.message === "timeout"); return null; });
    if (hung) { return fail("השרת לא עונה", "החיבור למסד הנתונים נתקע. לנסות שוב; אם חוזר — לכבות VPN / חוסם תוכן, או לנסות ברשת אחרת."); }

      const adm = (await withTimeout(db.ref(`${ROOT}_access/${u.uid}`).get(), 15000).catch(() => null))?.val();
