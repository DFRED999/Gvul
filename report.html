    ${mine.map(p => `<div class="rep"><div class="t"><b>${esc(actName(p.activityId))}</b><small>${fmtD(p.date)} · ${esc(D.contractors?.[p.contractorId]?.name || "")} · ${p.qty ? `${p.qty} יח׳` : `${esc(segName(p.segmentId))} ${rng(esc(p.secFrom), esc(p.secTo))}${(s => s ? ` · ק.ד. ${kdOf(s, p.secFrom)}–${kdOf(s, p.secTo)}` : "")(segs.find(x => x.id === p.segmentId))} (${(Math.abs(p.secTo - p.secFrom) * SECTION_M).toLocaleString("he-IL")} מ׳)`}${p.note ? " · " + esc(p.note) : ""}</small></div>
      ${p.review === "לבדיקה" ? `<span class="pill p0">ממתין</span><button class="btn ghost" data-del="${p.id}" style="padding:6px 10px">מחיקה</button>` : p.review === "נדחה" ? `<span class="pill p2">לא אושר</span>` : `<span class="pill p1">אושר ✓</span>`}</div>`).join("") || `<p class="hint">עוד אין דיווחים</p>`}
  </div>`;
  fitTiles();
  $("out").onclick = () => fb.auth().signOut();
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { S.cid = b.dataset.c; S.acts = []; S.segId = ""; S.msg = ""; S.dup = null; view(); });
  app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const id = b.dataset.a, isU = x => D.activities?.[x]?.unit === "יח׳";
    S.acts = isU(id) || S.acts.some(isU) ? (S.acts.includes(id) ? [] : [id]) : S.acts.includes(id) ? S.acts.filter(x => x !== id) : [...S.acts, id];
    S.msg = ""; S.dup = null; view(); });
  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { S.segId = b.dataset.s; S.dup = null; view(); });
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "בטוח?"; return; } await fb.database().ref(`${ROOT}/progress/${b.dataset.del}`).remove(); });
  $("dt").onchange = e => { if (e.target.value && +e.target.value.slice(0, 4) > 1990) S.date = e.target.value; };
  $("note").oninput = e => S.note = e.target.value;
  const numIn = (id, k) => { const el = $(id); if (!el) return; el.oninput = () => { if (S.dup) { S.dup = null; document.querySelector(".dup")?.remove(); } S[k] = el.value.trim() === "" ? "" : Number(el.value); const mm = $("m"); if (mm) { const v = S.from !== "" && S.to !== "" && !isNaN(S.from) && !isNaN(S.to) ? Math.abs(S.to - S.from) * SECTION_M : null; mm.textContent = v === null ? "" : v.toLocaleString("he-IL") + " מ׳"; } }; };
  numIn("f", "from"); numIn("t", "to"); numIn("qty", "qty");
  ["f", "t"].forEach(id => { const el = $(id); if (el) el.addEventListener("input", () => { S.byKd = false; S.kf = S.kt = ""; }); });   // בלי רינדור — כדי לא לאבד את הפוקוס בין השדות
  ["kf", "kt"].forEach(id => { const el = $(id); if (el) el.oninput = () => S[id] = el.value; });
  if ($("kdt")) $("kdt").onclick = () => { S.kdOpen = !S.kdOpen; view(); };
  if ($("kgo")) $("kgo").onclick = () => {   // ק.ד. → קטע + חתכים
    const a = kdNum(S.kf), z = kdNum(S.kt); if (a === null || z === null) { S.msg = "צריך ק.ד. התחלה וסוף"; S.err = true; return view(); }
    const mid = (a + z) / 2, s = segs.find(x => { const p = kdNum(x.kdFrom), q = kdNum(x.kdTo); return mid >= Math.min(p, q) && mid <= Math.max(p, q); });
    if (!s) { S.msg = "הק.ד. לא נמצא באף קטע של הקבלן"; S.err = true; return view(); }
    const p = secOf(s, a), q = secOf(s, z); Object.assign(S, { segId: s.id, from: Math.min(p, q), to: Math.max(p, q), byKd: true, msg: "", err: false }); view(); };
  if ($("loc")) $("loc").oninput = e => S.loc = e.target.value;
  $("send").onclick = async () => {
    const bad = t => { S.msg = t; S.err = true; view(); };
    if (!sel.length) return bad("צריך לבחור מלאכה");
    if (!S.date) return bad("חסר תאריך");
    const base = { contractorId: c.id, date: S.date, note: S.note.trim(), review: me.admin ? "" : "לבדיקה", baseline: false, reportedBy: me.email, reportedByName: me.name || "", updatedAt: new Date().toISOString(), updatedBy: me.email };
    if (unit) { if (!(S.qty > 0)) return bad("צריך כמות"); return sendRecs([{ ...base, activityId: act.id, segmentId: "", secFrom: "", secTo: "", qty: Number(S.qty), loc: S.loc || "" }]); }
    if (!seg) return bad("צריך לבחור קטע תכנון");
    if (S.from === "" || S.to === "" || isNaN(S.from) || isNaN(S.to) || S.from === S.to) return bad("צריך חתך התחלה וחתך סוף (שונים)");
    if (Math.min(S.from, S.to) < seg.lo || Math.max(S.from, S.to) > seg.hi) return bad(`החתכים מחוץ לקטע (${rng(seg.lo, seg.hi)})`);
    const lo = Math.min(S.from, S.to), hi = Math.max(S.from, S.to), clean = [], hits = [];
    for (const a of sel) {   // כפילות נבדקת לכל מלאכה בנפרד
      const rec = { ...base, activityId: a.id, segmentId: seg.id, secFrom: S.from, secTo: S.to, ...(S.byKd ? { byKd: true, kdFrom: S.kf, kdTo: S.kt } : {}) };
      const pr = priorOf(c.id, a.id, seg.id), overl = pr.filter(p => ivOf(p)[0] < hi && ivOf(p)[1] > lo);
      if (!overl.length) { clean.push(rec); continue; }
      const gaps = gapsIn(lo, hi, mergeIv(pr.map(ivOf)));
      hits.push({ rec, name: short(a.name), full: !gaps.length, gaps,
        overl: overl.map(p => ({ f: ivOf(p)[0], t: ivOf(p)[1], date: p.date, by: p.reportedByName || (p.reportedBy || "משרד").split("@")[0], st: p.review === "לבדיקה" ? "ממתין" : "אושר" })) });
    }
    if (!hits.length) return sendRecs(clean);
    S.dup = { clean, hits, full: hits.every(x => x.full) && !clean.length }; S.msg = ""; S.err = false; view();
  };
  const sendRecs = async (recs, extra = "") => {
    $("send").disabled = true;
    try { for (const r of recs) await fb.database().ref(`${ROOT}/progress`).push(r);
      const nA = new Set(recs.map(r => r.activityId)).size;
      const mOf = rs => (rs.reduce((s, r) => s + Math.abs(r.secTo - r.secFrom), 0) * SECTION_M).toLocaleString("he-IL") + " מ׳";
      const len = unit ? `${S.qty} יח׳` : nA > 1 ? [...new Set(recs.map(r => r.activityId))].map(id => `${short(D.activities?.[id]?.name || "")} ${mOf(recs.filter(r => r.activityId === id))}`).join(" · ") : mOf(recs); S.dup = null;
      Object.assign(S, { from: unit ? S.from : S.to, to: "", qty: "", note: "", byKd: false, kf: S.byKd ? S.kt : "", kt: "", msg: `נשלח ✓ ${len}${extra}${recs.every(r => r.review === "") ? " — נקלט כמאושר" : " — ממתין לאישור"}`, err: false });
    } catch (e) { S.msg = "השליחה נכשלה — אין הרשאה לקבלן הזה או אין חיבור"; S.err = true; }

  };
  if ($("dupNo")) $("dupNo").onclick = () => { S.dup = null; view(); };
  if ($("dupNew")) $("dupNew").onclick = () => sendRecs([...S.dup.clean, ...S.dup.hits.flatMap(x => x.gaps.map(([p, q]) => ({ ...x.rec, secFrom: p, secTo: q, byKd: false })))], " (רק מה שחדש)");
  if ($("dupFix")) $("dupFix").onclick = () => { if (!S.note.trim()) { S.msg = "בבקשת תיקון — כתוב בהערה מה שגוי בדיווח הקודם"; S.err = true; return view(); }
    sendRecs([...S.dup.clean.map(r => ({ ...r, note: S.note.trim() })), ...S.dup.hits.map(x => ({ ...x.rec, note: S.note.trim(), correction: true, review: "לבדיקה" }))], " — בקשת תיקון"); };
}
/* רענון בלי לקטוע הקלדה: אם המפקח באמצע שדה — מחכים שיצא ממנו */
let later = false;
const VER = "2026-10-09i";
const fail = (title, detail = "") => { app.innerHTML = `<div class="card"><b>${esc(title)}</b>${detail ? `<div class="small" style="margin-top:6px;color:#666;direction:ltr;text-align:left;word-break:break-word">${esc(detail)}</div>` : ""}
  <div class="row" style="margin-top:12px;gap:8px"><button class="btn" onclick="location.reload()">לנסות שוב</button><button class="btn ghost" onclick="try{firebase.auth().signOut()}catch(e){};setTimeout(()=>location.reload(),300)">התנתקות</button></div>
  <div class="small" style="margin-top:10px;color:#999">גרסה ${VER}</div></div>`; };
const safeView = () => { try { view(); } catch (e) { console.error(e); fail("שגיאה בהצגת הדף", (e && e.message || e) + ""); } };
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, no) => setTimeout(() => no(new Error("timeout")), ms))]);
const soft = () => { const el = document.activeElement; if (el && /INPUT|TEXTAREA/.test(el.tagName) && app.contains(el)) { later = true; return; } safeView(); };
document.addEventListener("focusout", () => { if (later) { later = false; setTimeout(safeView); } });
(async () => {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  try {
    await withTimeout(loadScript(base + "firebase-app-compat.js"), 20000);
    await withTimeout(Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-database-compat.js")]), 20000);
    fb = firebase; fb.initializeApp(FIREBASE_CONFIG);
  } catch (e) { return fail("לא ניתן להתחבר לשרת (Firebase)", "בדוק חיבור לאינטרנט. אם יש חוסם פרסומות / VPN / סינון תוכן באייפד — לכבות ולנסות שוב."); }
  let bootTimer = null;
  let offs = [];
  fb.auth().onAuthStateChanged(async u => {
    offs.forEach(f => f()); offs = []; user = u; D = {};
    if (!u) return login();
    app.innerHTML = `<div class="card">טוען…</div>`;
    clearTimeout(bootTimer);
    let hung = false; const db = fb.database(), acc = await withTimeout(db.ref(`${ROOT}/tableConfig/inspectorAccess/${emailKey(u.email)}`).get(), 15000).catch(e => { hung = !!(e && e.message === "timeout"); return null; });
    if (hung) { return fail("השרת לא עונה", "החיבור למסד הנתונים נתקע. לנסות שוב; אם חוזר — לכבות VPN / חוסם תוכן, או לנסות ברשת אחרת."); }
    me = acc?.val();
    if (!me) {   // מנהל פעיל באתר הראשי — גישה לכל הקבלנים הראשיים
      const adm = (await withTimeout(db.ref(`${ROOT}_access/${u.uid}`).get(), 15000).catch(() => null))?.val();
      if (adm?.active) me = { name: adm.name || "", admin: true, contractors: {} };
    }
    if (!me) return noAccess();
    me.email = String(u.email).toLowerCase();
    const COLS6 = ["contractors", "activities", "designSegments", "designOffices", "kdSections", "progress"], got = new Set(), bad = [];
    for (const col of COLS6) {
      const ref = db.ref(`${ROOT}/${col}`), cb = ref.on("value", s => { D[col] = s.val() || {}; got.add(col); if (got.size === COLS6.length) soft(); },
        err => { if (col === "kdSections") { D[col] = {}; got.add(col); if (got.size === COLS6.length) soft(); return; }   // טבלת עזר — בלעדיה ההמרה ק.ד.↔חתך משוערת
          bad.push(col); fail("אין הרשאה לקרוא נתונים", `${col}: ${err && err.message || err}`); });
      offs.push(() => ref.off("value", cb));
    }
    bootTimer = setTimeout(() => { if (got.size < COLS6.length && !bad.length) fail("הנתונים לא נטענו", "חסר: " + COLS6.filter(c => !got.has(c)).join(", ")); }, 20000);
  });
})();
