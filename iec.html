   contacts   = אנשי קשר · settings = שלבים, התראות, מע״מ, לוגואים, קבלנים
   ===================================================================== */
:root { --navy: #0b3a6e; --blue: #0a6ec9; --sky: #e8f2fc; --org: #f39200; --org2: #fff3df; --ink: #14223a; --mut: #63708a; --line: #dfe5ee; --bg: #f3f6fa; --card: #fff; --ok: #1f8a4c; --warn: #c0392b; --amber: #e0a100; }
* { box-sizing: border-box; }

.spacer { flex: 1; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
/* ---- כותרת ---- */
.top { background: linear-gradient(120deg, var(--navy), #0d4f94 60%, var(--blue)); color: #fff; padding: 12px 22px 0; position: sticky; top: 0; z-index: 20; box-shadow: 0 4px 16px -8px rgba(0,0,0,.5); }
.top-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.brand h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .2px; } .brand span { font-size: 13px; opacity: .85; }
.brand-bar { width: 6px; height: 40px; border-radius: 3px; background: var(--org); }
.srch { position: relative; flex: 1; max-width: 460px; min-width: 200px; }
.srch input { width: 100%; border: 0; border-radius: 999px; padding: 9px 40px 9px 16px; background: rgba(255,255,255,.96); color: var(--ink); }
.srch::before { content: "⌕"; position: absolute; right: 14px; top: 6px; font-size: 19px; color: var(--mut); z-index: 1; }
.srch-res { position: absolute; top: 44px; right: 0; left: 0; background: #fff; color: var(--ink); border-radius: 14px; box-shadow: 0 14px 40px -10px rgba(0,0,0,.45); max-height: 60vh; overflow: auto; z-index: 30; }
.srch-res button { all: unset; box-sizing: border-box; display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--line); }
.srch-res button:hover { background: var(--sky); } .srch-res i { font-style: normal; font-size: 12px; color: var(--mut); margin-inline-start: auto; }
.who { font-size: 13px; opacity: .9; } .who b { display: block; }
.tbtn { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }
.tab { background: transparent; border: 0; color: #d7e6f7; padding: 10px 16px 11px; border-radius: 12px 12px 0 0; cursor: pointer; font-weight: 700; white-space: nowrap; }
.tab.on { background: var(--bg); color: var(--navy); } .tab:hover:not(.on) { background: rgba(255,255,255,.1); }
.tab .bd { background: var(--org); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-inline-start: 5px; }
main { padding: 18px 22px 60px; max-width: 1600px; margin: 0 auto; }
/* ---- כרטיסים ---- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 6px 18px -16px rgba(11,58,110,.6); }
.card h2 { margin: 0 0 12px; font-size: 18px; color: var(--navy); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .card h2 small { font-weight: 400; font-size: 13px; color: var(--mut); }
.grid { display: grid; gap: 16px; } .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1.3fr 1fr; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }

.kpi { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; }

.leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--mut); margin-top: 8px; } .leg i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-inline-end: 4px; vertical-align: -1px; background: var(--dc); }
/* ---- רשימות ---- */

.li { all: unset; box-sizing: border-box; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }

.tag.r { --tc: #fde7e4; --tt: #a3271b; } .tag.a { --tc: #fff1d1; --tt: #8a5a00; } .tag.g { --tc: #e2f4e9; --tt: #17683a; } .tag.gr { --tc: #eef0f3; --tt: #5c6678; }
/* ---- מתקנים ---- */
.flt { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.inp { border: 1px solid #ccd5e1; border-radius: 10px; padding: 7px 10px; background: #fff; min-width: 0; } .inp:focus { outline: 2px solid #9cc5ee; border-color: var(--blue); }
.inp.sm { padding: 5px 8px; font-size: 14px; } .inp:disabled { background: #f1f4f8; color: #4b5568; cursor: not-allowed; }
.btn { border: 0; background: var(--blue); color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; } .btn:hover { filter: brightness(1.07); }
.btn.o { background: var(--org); } .btn.gh { background: #fff; color: var(--navy); border: 1px solid #c8d4e3; font-weight: 500; } .btn.sm { padding: 5px 10px; font-size: 13.5px; } .btn.del { background: #fff; color: var(--warn); border: 1px solid #f0c4be; font-weight: 500; }
.btn[disabled] { opacity: .45; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { all: unset; cursor: pointer; border: 1px solid #c8d4e3; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13.5px; } .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); } .chip small { opacity: .7; margin-inline-start: 4px; }

.chain { display: flex; gap: 3px; } .chain i { flex: 1; height: 8px; border-radius: 4px; background: #e3e9f1; } .chain i.d { background: var(--sc); } .chain i.c { background: repeating-linear-gradient(45deg, var(--sc), var(--sc) 4px, #fff 4px, #fff 7px); } .chain i.x { background: #f3c1bb; }

table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }

table.mx td.nm b { display: block; } table.mx td.nm small { color: var(--mut); } table.mx tr.gh td { background: #f4f7fb; text-align: right; font-weight: 800; color: var(--navy); position: sticky; right: 0; }
table.t tr td select.ce { min-width: 14ch; }
table.t td input.ce, table.t td select.ce { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; width: 100%; min-width: 70px; } table.t td input.ce:hover, table.t td select.ce:hover { border-color: #ccd5e1; } table.t td input.ce:focus { border-color: var(--blue); background: #fff; outline: none; }
table.t td.num, table.t th.num { text-align: left; direction: ltr; } table.t tfoot td { position: sticky; bottom: 0; background: #fff8ec; font-weight: 800; border-top: 2px solid #f2c48a; }
table.t tr.gh td { background: #f4f7fb; font-weight: 700; color: var(--navy); }
/* ---- חלון ---- */

.mdl { background: #fff; border-radius: 18px; width: min(1000px, 100%); padding: 20px 22px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
.mdl.sm { width: min(560px, 100%); } .mdl h2 { margin: 0 0 4px; color: var(--navy); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 10px 0; }
.form label, label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--mut); font-weight: 500; }

.fgrp-b { display: grid; grid-template-columns: minmax(300px, 1fr) 30px repeat(2, minmax(300px, 1fr)); gap: 10px; align-items: center; } .fgrp-ar { font-size: 26px; color: var(--fg); text-align: center; font-weight: 800; }

function pickImg(cb) { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { if (/svg/.test(f.type)) return cb(r.result); const im = new Image(); im.onload = () => { const h = Math.min(120, im.height), w = Math.round(im.width * h / im.height), c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h); cb(c.toDataURL("image/png")); }; im.src = r.result; }; r.readAsDataURL(f); }; i.click(); }
