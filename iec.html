/** פס ק.ד.: צפון (ק.ד. גבוה) מימין, דרום משמאל — כמו הקבלנים באתר הראשי */
function strip(F) {
  const C = contractors().filter(c => kdN(c.kdFrom) !== null && kdN(c.kdTo) !== null), P = F.filter(f => kdN(f.kd) !== null);
  const ks = [...C.flatMap(c => [kdN(c.kdFrom), kdN(c.kdTo)]), ...P.map(f => kdN(f.kd))]; if (!ks.length) return `<div class="empty">אין ק.ד. למתקנים</div>`;
  const hi = Math.max(...ks), lo = Math.min(...ks), W = hi - lo || 1, x = k => ((hi - k) / W * 100);   // אחוז מימין
  const ST = stages(), lanes = { "ארון שקד": 52, "תט״ז": 30, "חדר טרפו": 40, "אתר איסוף": 18, "העתקת עמוד": 60, "אחר": 60 };
  const pos = f => ({ r: x(kdN(f.kd)), y: lanes[f.type] ?? 60 });
  const dots = P.map(f => { const s = state(f), c = s.cur ? s.cur.color : "#b6c2d3", p = pos(f);
    return `<span class="dot ${TSHAPE[f.type] || ""} ${s.stuck ? "st" : ""}" style="right:${p.r}%;top:${p.y}px;--dc:${c}" data-a="fac" data-id="${f.id}" title="${esc(`${f.name} · ק.ד. ${f.kd}\n${s.cur ? s.cur.name : "טרם התחיל"}${s.flags.map(x => "\n⏱ " + x.t).join("")}`)}"></span>`; }).join("");
  const lines = P.filter(f => f.type === "תט״ז").flatMap(t => Object.keys(t.feeds || {}).map(id => RAW.facilities[id]).filter(c => c && kdN(c.kd) !== null).map(c => { const a = pos(t), b = pos({ ...c, id: "" });
    return `<line x1="${100 - a.r}%" y1="${a.y}" x2="${100 - b.r}%" y2="${b.y}" stroke="#7c8fa8" stroke-width="1.4" stroke-dasharray="3 2"/>`; })).join("");
  const secs = C.map(c => { const a = x(kdN(c.kdFrom)), b = x(kdN(c.kdTo)), r = Math.min(a, b), w = Math.abs(b - a); return `<div class="sec" style="right:${r}%;width:${w}%;--cc:${c.color || "#0a6ec9"}"><b>${esc(c.name)}</b>ק.ד. ${esc(c.kdFrom)}–${esc(c.kdTo)}</div>`; }).join("");
  const ticks = [hi, ...[0.25, 0.5, 0.75].map(t => Math.round(hi - W * t)), lo].map(k => `<span class="kdl" style="right:${x(k)}%">${Math.round(k)}</span>`).join("");
  return `<div style="overflow-x:auto"><div style="min-width:760px"><div class="strip"><div class="ln"></div>${ticks}<svg>${lines}</svg>${dots}${secs}</div></div></div>
    <div class="leg"><span><i style="--dc:#b6c2d3"></i>טרם התחיל</span>${ST.map(s => `<span><i style="--dc:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>
    <div class="leg"><span>⚫ ארון שקד / אתר איסוף</span><span>◆ תט״ז</span><span>■ חדר טרפו / העתקת עמוד</span><span>צפון מימין ← דרום משמאל</span></div>`;
}

/** תצוגת טבלה: שורה לכל מתקן */
