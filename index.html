<style>
/* פריסה: תפריט ימני כהה בקבוצות + אזור עבודה בהיר. טבלאות בסגנון גיליון העבודה. */
:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { font-weight: 800; font-size: 18px; color: #fff; padding: 0 10px 14px; line-height: 1.25; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--side-muted); margin-top: 2px; }
.grp { font-size: 11.5px; letter-spacing: .04em; color: var(--side-muted); padding: 12px 12px 4px; }
.nav { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; }
.nav:hover { background: var(--side-hover); }
.nav .nl { flex: 1; } .ndot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--d); margin-inline-end: 9px; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.navbox { margin: 10px 0 6px; padding: 6px 6px 8px; border-radius: 16px; background: linear-gradient(170deg, rgba(143,196,166,.16), rgba(143,196,166,.05)); border: 1px solid rgba(143,196,166,.38); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.nb-h { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; color: #d9f0e2; padding: 6px 8px 4px; }

  /* נייד: פס עליון עם ☰ — התפריט נפתח כמגירה מהצד */

async function svClick(act, b) {

  else if (act === "svS") { S.segId = b.dataset.id; S.idx = 0; S.sel = []; S.anchor = null; svReset(S); render(); }
  else if (act === "svGo") { S.idx += Number(b.dataset.id); svReset(S); render(); }   // בלי קפיצה — המסך נשאר במקום

    const recs = acts.map(a => [a.id, svState(ivs, a.id, p.from, p.to)]).filter(([, s]) => s === "✓" || s === "✗").map(([a, s]) => svRec(S, a, F, T, s));

function svKdInput(t) {

  const segOrd = id => { const s = d.designSegments.find(x => x.id === id), k = s ? Math.min(kdNum(s.kdFrom) ?? 1e9, kdNum(s.kdTo) ?? 1e9) : 1e9; return k; };

/* =====================================================================
   §14 מסירות תוכניות — כל מסירה היא טווח ק.ד. שנמסר לקבלן, בתאריך ובמהדורה.
   קטעי התכנון, המשרד והאורך נגזרים אוטומטית מטבלת קטעי התכנון.
   מסירה שמסירה מאוחרת יותר מכסה את כל הטווח שלה — מסומנת "הוחלפה".
   ===================================================================== */
const DLV_STATUS = ["לביצוע", "לאישור", "לעיון", "למידע", "מבוטל"];
const DLV_KINDS = ["תנוחה וחתכים", "חשמל ותקשורת", "קונסטרוקציה ופרטים", "ניקוז ומעבירי מים", "שערים", "אחר"];
function supersededBy(dl, all) {
  const r = kdRange(dl); if (!r) return null;
  return all.find(o => o.id !== dl.id && o.contractorId === dl.contractorId && o.status !== "מבוטל" && (o.kind || "") === (dl.kind || "") &&
    (String(o.date) > String(dl.date) || (o.date === dl.date && String(o.updatedAt) > String(dl.updatedAt))) &&
    (() => { const q = kdRange(o); return q && q.lo <= r.lo && q.hi >= r.hi; })()) || null;
}
/** אחוז מהגזרה שכבר נמסרו לו תוכניות (לפי ק.ד., בלי מבוטלות) */
function deliveryCoverage(range, dls) {
  if (!range) return null;
  const c = coverage(range, dls.filter(x => x.status !== "מבוטל" && (!x.kind || x.kind === DLV_KINDS[0])));
  return c ? c.pct : null;
}
/** מסירות: סנכרון ק.ד. ↔ חתך. חתכים חוזרים בין משרדים — לכן מעדיפים את קטעי התכנון שבגזרת הקבלן, ושומרים לאיזה קטע שייך החתך */
function dlvSegs(d, cid) { const c = d.contractors.find(x => x.id === cid), all = d.designSegments.filter(s => segKdSec(s));
  const own = c && kdRange(c) ? designInRange(d, kdRange(c)).map(x => x.s).filter(s => segKdSec(s)) : []; return { own, all }; }
const kdStr = k => k === null || k === undefined || isNaN(k) ? "" : String(Math.round(k * 10) / 10);
function dlvKdToSec(d, cid, kd) { const k = kdNum(kd); if (k === null) return null; const { own, all } = dlvSegs(d, cid);
  const s = segOfKd(own, k) || segOfKd(all, k); return s ? { sec: kd2sec(s, k), seg: s.id } : null; }
function dlvSecToKd(d, cid, sec, hint) { const n = Number(sec); if (sec === "" || sec == null || isNaN(n)) return null; const { own, all } = dlvSegs(d, cid);
  const inSeg = s => n >= Math.min(+s.secFrom, +s.secTo) && n <= Math.max(+s.secFrom, +s.secTo);
  const c1 = own.filter(inSeg), c2 = all.filter(inSeg), s = c1.find(x => x.id === hint) || (c1.length === 1 ? c1[0] : null) || c2.find(x => x.id === hint) || (c1[0] || (c2.length === 1 ? c2[0] : null));
  return s ? { kd: kdStr(sec2kd(s, n)), seg: s.id, many: c1.length > 1 || (!c1.length && c2.length > 1) } : null; }
/** מה לעדכן כשמשנים ק.ד. או חתך במסירה */
function dlvSync(d, x, key, v) {
  const end = /From$/.test(key) ? "From" : "To", p = { [key]: v };
  if (key === "kdFrom" || key === "kdTo") { const r = dlvKdToSec(d, x.contractorId, v); Object.assign(p, r ? { ["sec" + end]: r.sec, ["sec" + end + "Seg"]: r.seg } : { ["sec" + end]: "", ["sec" + end + "Seg"]: "" }); }
  else { const r = dlvSecToKd(d, x.contractorId, v, x["sec" + end + "Seg"] || x["sec" + (end === "From" ? "To" : "From") + "Seg"]); if (r) Object.assign(p, { ["kd" + end]: r.kd, ["sec" + end + "Seg"]: r.seg }); }
  return p;
}
const segName = (d, id) => { const s = d.designSegments.find(x => x.id === id); return s ? `${d.designOffices.find(o => o.id === s.officeId)?.name || ""} ${s.num}` : ""; };
function dlvEmpty(cid = "") { return ({ date: todayStr(), contractorId: cid, kdFrom: "", kdTo: "", secFrom: "", secTo: "", title: "", kind: "תנוחה וחתכים", revision: "", status: "לביצוע", note: "", msg: "", err: false }); }

function deliveryForm(d, fixedCid) {
  const f = ui.df; if (fixedCid) f.contractorId = fixedCid;
  const r = kdRange(f), L = lenFromDesign(d, r);

    <label class="field">מק.ד.<input id="df_from" value="${esc(f.kdFrom)}" data-df="kdFrom" data-rerender="1" inputmode="decimal"></label>
    <label class="field">עד ק.ד.<input id="df_to" value="${esc(f.kdTo)}" data-df="kdTo" data-rerender="1" inputmode="decimal"></label>
    <label class="field">או מחתך${f.secFromSeg ? ` <small class="muted">${esc(segName(d, f.secFromSeg))}</small>` : ""}<input id="df_sfrom" value="${esc(f.secFrom ?? "")}" data-df="secFrom" data-rerender="1" inputmode="numeric"></label>
    <label class="field">עד חתך${f.secToSeg ? ` <small class="muted">${esc(segName(d, f.secToSeg))}</small>` : ""}<input id="df_sto" value="${esc(f.secTo ?? "")}" data-df="secTo" data-rerender="1" inputmode="numeric"></label>
    <label class="field">תיאור / סט תוכניות<input id="df_title" value="${esc(f.title)}" data-df="title" placeholder="לדוגמה: תנוחה וחתכים"></label>
    <label class="field">סוג<select id="df_kind" data-df="kind">${DLV_KINDS.map(k => `<option ${k === f.kind ? "selected" : ""}>${k}</option>`).join("")}</select></label>
    <label class="field">מהדורה<input id="df_rev" value="${esc(f.revision)}" data-df="revision" placeholder="0 / A / 3"></label>
    <label class="field">סטטוס<select id="df_status" data-df="status">${DLV_STATUS.map(s => `<option ${s === f.status ? "selected" : ""}>${s}</option>`).join("")}</select></label>
    <label class="field">הערה<input id="df_note" value="${esc(f.note)}" data-df="note"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <span class="small">${r ? (L ? `<b>${L.approx ? "≈" : ""}${MTR(L.km)}</b> · ${L.parts.map(x => `${esc(x.office?.name || "")} ${esc(x.s.num)}${x.full ? "" : ` (${Math.round(x.frac * 100)}%)`}`).join(", ")}` : `<span class="pill">אין קטעי תכנון בטווח הזה</span>`) : `<span class="muted">הקלד ק.ד. מ–עד כדי לראות אילו קטעי תכנון נכללים</span>`}
      ${outside ? ` <span class="pill warn">חורג מגזרת הקבלן</span>` : ""}</span>
    <span class="spacer"></span><button class="btn" data-act="saveDlv">שמירת מסירה</button>
  </div>${f.msg ? `<p class="small" style="margin:8px 0 0;color:${f.err ? "var(--warn)" : "var(--accent)"}">${esc(f.msg)}</p>` : ""}`;
}
function pageDeliveries(d) {
  if (!ui.dfilter) ui.dfilter = "";
  const rows = d.deliveries.filter(x => !ui.dfilter || x.contractorId === ui.dfilter).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return `<h1>מסירות תוכניות</h1><p class="sub">כל מסירה נרשמת כטווח ק.ד. קטעי התכנון, המשרד והאורך נגזרים מטבלת קטעי התכנון.</p>
  <div class="card"><h2>רישום מסירה</h2>${deliveryForm(d, "")}</div>

/* =====================================================================
   §15 נושאים פתוחים — חסמים, משימות והחלטות שעולים בפגישות הפיקוח.
   לכל נושא: מיקום (ק.ד.), אחראי, סטטוס, ותיעוד עדכונים לפי תאריך.
   ===================================================================== */
const ISSUE_STATUS = ["פתוח", "בטיפול", "HOLD", "סגור"];
const ISSUE_CATS = ["תכנון", "חסם", "תשתיות קיימות", "מעבירי מים", "שערים ומעברים", "חשמל ותקשורת", "בטיחות ואבטחה", "רשויות", "אחר"];
const ISSUE_OWNERS = ["מנה״פ", "מתאם הנדסי", "פיקוח", "קבלן", "משהב״ט", "מנהלת", "חח״י", "רשות העתיקות", "רלפ״ם", "רט״ג", "מתכנן"];
const issueHist = x => Object.values(x.history || {}).sort((a, b) => String(a.date).localeCompare(String(b.date)));
const daysSince = s => s ? Math.floor((Date.now() - new Date(s + "T12:00:00")) / 864e5) : null;

/** פניות מהשטח: טקסט חופשי ממפקח באתר הדיווח → כאן עונים / הופכים לנושא / סוגרים. התשובה מופיעה למפקח באתר הדיווח */
/* =====================================================================
   §16 מסך אישורים מרכזי — כל הדיווחים שממתינים, מכל הקבלנים, עם סימון בעיות ואישור בבת אחת
   ===================================================================== */
/** עדכון של הרבה רשומות בפעולה אחת (ב-Firebase: עדכון רב-נתיבי אחד) */
async function bulkPatch(col, ids, patch) {
  if (!ids.length || denyWrite(col, ids[0], patch)) return;
  const st = stamp();
  if (LOCAL) { ids.forEach(id => { if (RAW[col][id]) RAW[col][id] = { ...RAW[col][id], ...patch, ...st }; }); touched(); render(); return true; }
  // עדכון מרובה־נתיבים: המפתחות הם נתיבים ("progress/<id>/review") — אסור להעביר אותם דרך fbSafe (שהופך "/" ל-"_" וכך הכתיבה הלכה למפתח זבל ולא לדיווח)
  const upd = {}; ids.forEach(id => Object.entries({ ...patch, ...st }).forEach(([k, v]) => { if (v !== undefined) upd[`${col}/${fbKey(id)}/${fbKey(k)}`] = v && typeof v === "object" ? fbSafe(v) : v; }));

    <h3>לא הוזכרו בסיכום — סומנו לבדיקה, הסטטוס לא שונה</h3>${li(rep.gone, r => `<li>${esc(r.t)}</li>`)}

    <p class="small muted">כל עדכון נשמר בהיסטוריה של הנושא, ואפשר לערוך אותו בטבלה כרגיל.</p>
    <div class="row"><button class="btn" id="mNo">סגירה</button><span class="spacer"></span>
      <button class="btn ghost" id="mManual">ביטול ומעבר לאישור ידני</button><button class="btn del" id="mUndo">ביטול כל העדכונים</button></div>`,
    (m, close) => {
      m.querySelector(".card").classList.add("wide");

      m.querySelector("#mUndo").onclick = async () => { close(); await undo(); alertModal("כל העדכונים מהסיכום בוטלו.", "בוטל"); };
      m.querySelector("#mManual").onclick = async () => { close(); await undo(); const cfg = RAW.tableConfig?.issues || {};
        RAW.tableConfig.issues = { ...cfg, autoSummary: false }; try { await importSummary(file, cid); } finally { RAW.tableConfig.issues = cfg; } };

}

async function importSummary(file, cid) {
  let lines;
  try { lines = await fileToLines(file); } catch (e) { return alertModal("לא הצלחתי לקרוא את הקובץ: " + (e.message || e)); }
  const text = lines.join("\n"), units = splitItems(lines);
  if (units.length < 3) return alertModal("לא נמצאו סעיפים בקובץ. ייתכן שזה מסמך סרוק (תמונה) — שלח אותו אליי ואחלץ ממנו ידנית.");
  const date = meetingDate(text, file.name) || todayStr();
  const issues = list("issues").filter(x => x.contractorId === cid);
  const { matched, fresh } = analyzeSummary(issues, units);
  const upd = matched.filter(m => m.item && similar(m.item.text, m.issue.last) <= 0.7);
  const same = matched.filter(m => m.item && similar(m.item.text, m.issue.last) > 0.7);
  const gone = matched.filter(m => !m.item);
  const dup = list("meetings").some(m => m.contractorId === cid && m.date === date);
  if (RAW.tableConfig?.issues?.autoSummary !== false) return autoApplySummary({ file, cid, date, units, upd, same, gone, fresh, dup });
  const stSel = (id, v) => `<select class="inp" data-k="${id}" data-f="status">${ISSUE_STATUS.map(s => `<option ${s === v ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  const row = (id, on, title, body, status, extra = "") => `<div class="sumrow" data-k="${id}">
      <label class="row" style="gap:8px;align-items:flex-start"><input type="checkbox" data-k="${id}" data-f="on" ${on ? "checked" : ""}><b style="flex:1">${title}</b>${status}</label>
      ${body}${extra}</div>`;
  const html = `<h2>עדכון נושאים מסיכום פגישה</h2>
    <div class="row small"><span>קובץ: <b>${esc(file.name)}</b></span><label class="row">תאריך הפגישה <input type="date" class="inp" id="sumDate" value="${date}"></label>
      <span class="muted">${units.length} סעיפים נקראו</span></div>
    ${dup ? `<p class="pill warn">כבר נקלט סיכום של פגישה מתאריך זה. עדכונים כפולים ייווספו להיסטוריה.</p>` : ""}
    <p class="small muted" style="margin:4px 0 0">מסומנים מראש רק העדכונים הבטוחים. עוברים, מתקנים טקסט או סטטוס לפי הצורך, ולוחצים "החלת העדכונים".</p>
    <h3>עודכנו בסיכום (${upd.length})</h3>
    ${upd.map(m => row(m.issue.id, true, esc(m.issue.title), `<div class="small muted">היה: ${esc(m.issue.last || "—")}</div><textarea class="inp" rows="2" data-k="${m.issue.id}" data-f="text">${esc(m.item.text)}</textarea>`, stSel(m.issue.id, suggestStatus(m.item.text, m.issue.status, m.issue)))).join("") || `<p class="muted small">אין</p>`}
    <h3>הוזכרו ללא שינוי (${same.length})</h3>
    ${same.map(m => row(m.issue.id, true, esc(m.issue.title), `<div class="small muted">${esc(m.item.text.slice(0, 160))}</div><input type="hidden" data-k="${m.issue.id}" data-f="touch" value="1">`, stSel(m.issue.id, m.issue.status), ` <span class="pill">יעודכן רק תאריך</span>`)).join("") || `<p class="muted small">אין</p>`}
    <h3>לא הוזכרו בסיכום (${gone.length}) — ייתכן שנסגרו</h3>
    ${gone.map(m => row(m.issue.id, false, esc(m.issue.title), `<div class="small muted">מצב אחרון (${fmtD(m.issue.updated)}): ${esc(m.issue.last || "—")}</div><input type="hidden" data-k="${m.issue.id}" data-f="text" value="לא הוזכר בסיכום הפגישה">`, stSel(m.issue.id, "סגור"))).join("") || `<p class="muted small">אין</p>`}
    <h3>סעיפים בסיכום שלא שויכו לנושא (${fresh.length}) — אפשר לפתוח כנושא חדש</h3>
    ${fresh.map((u, i) => { const n = numbersIn(u.text), kd = [...n.kd].sort((a, b) => b - a);
      return row("new" + i, false, `<input class="inp" style="width:100%" data-k="new${i}" data-f="title" value="${esc(u.title.slice(0, 90))}">`,
        `<div class="small muted">${esc(u.text.slice(0, 220))}</div><input type="hidden" data-k="new${i}" data-f="text" value="${esc(u.text)}"><input type="hidden" data-k="new${i}" data-f="cat" value="${esc(guessCat(u.section + " " + u.head))}"><input type="hidden" data-k="new${i}" data-f="kd" value="${kd.slice(0, 2).join("|")}">`,
        stSel("new" + i, "פתוח")); }).join("") || `<p class="muted small">אין</p>`}
    <div class="row" style="position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 2px"><button class="btn" id="mYes">החלת העדכונים</button><button class="btn ghost" id="mNo">ביטול</button><span class="spacer"></span><span class="small muted" id="sumCount"></span></div>`;
  modal(html, (m, close) => {
    m.querySelector(".card").classList.add("wide");
    const cnt = () => { m.querySelector("#sumCount").textContent = `${m.querySelectorAll('input[data-f="on"]:checked').length} פריטים מסומנים`; };
    m.addEventListener("change", cnt); cnt();
    m.querySelector("#mNo").onclick = close;
    m.querySelector("#mYes").onclick = async () => {
      const dt = m.querySelector("#sumDate").value || date, val = (k, f) => m.querySelector(`[data-k="${k}"][data-f="${f}"]`)?.value;
      let n = 0;
      for (const cb of m.querySelectorAll('input[data-f="on"]:checked')) {
        const k = cb.dataset.k, st = val(k, "status"), txt = (val(k, "text") || "").trim();
        if (k.startsWith("new")) {
          const kd = (val(k, "kd") || "").split("|").filter(Boolean);
          await api.add("issues", { contractorId: cid, title: (val(k, "title") || "").trim() || "נושא חדש", category: val(k, "cat"), kdFrom: kd[0] || "", kdTo: kd[1] || "", owner: "", status: st,
            opened: dt, updated: dt, last: txt, history: { [newId()]: { date: dt, text: txt } }, source: "summary" });
        } else {
          const x = RAW.issues[k]; if (!x) continue;
          if (val(k, "touch")) { if (dt >= (x.updated || "")) await api.update("issues", k, { updated: dt, status: st }); }
          else { const newer = dt >= (x.updated || ""); await api.update("issues", k, { history: { ...(x.history || {}), [newId()]: { date: dt, text: txt } }, ...(newer ? { last: txt, updated: dt, status: st } : {}) }); }
        }
        n++;
      }
      await api.add("meetings", { contractorId: cid, date: dt, file: file.name, units: units.length, applied: n });
      close(); alertModal(`עודכנו ${n} פריטים מהסיכום של ${fmtD(dt)}.`, "בוצע");
    };
  });
}

const COL_TYPES = [["text", "טקסט"], ["number", "מספר"], ["money", "סכום ₪ (עם סה״כ)"], ["date", "תאריך"], ["link", "קישור"], ["check", "סימון ✓"]];

    const redraw = () => { const y = card.querySelector(".collist")?.scrollTop || 0; card.innerHTML = draw(); wire(); card.querySelector(".collist").scrollTop = y; };
    const keys = () => [...card.querySelectorAll(".colrow")].map(r => r.dataset.key);
    const wire = () => {
      card.querySelector("#mNo").onclick = close;
      card.querySelector("#mReset").onclick = async () => { await setCfg(table, { order: null }); redraw(); };
      card.querySelectorAll("[data-colkey]").forEach(cb => cb.onchange = async () => {
        const h = { ...hiddenOf(table) }; if (cb.checked) delete h[cb.dataset.colkey]; else h[cb.dataset.colkey] = true;
        await setCfg(table, { hidden: Object.keys(h).length ? h : { _none: true } });
      });
      card.querySelectorAll("[data-mv]").forEach(btn => btn.onclick = async () => {
        const k = keys(), i = k.indexOf(btn.dataset.key), j = i + Number(btn.dataset.mv);
        if (j < 0 || j >= k.length) return; [k[i], k[j]] = [k[j], k[i]];
        await saveOrder(table, k); redraw();
      });
      // גרירה
      let dragKey = null;
      card.querySelectorAll(".colrow").forEach(row => {
        row.ondragstart = e => { dragKey = row.dataset.key; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
        row.ondragend = () => row.classList.remove("dragging");
        row.ondragover = e => { e.preventDefault(); row.classList.add("over"); };
        row.ondragleave = () => row.classList.remove("over");
        row.ondrop = async e => {
          e.preventDefault(); row.classList.remove("over");
          if (!dragKey || dragKey === row.dataset.key) return;
          const k = keys().filter(x => x !== dragKey); k.splice(k.indexOf(row.dataset.key), 0, dragKey);
          await saveOrder(table, k); redraw();
        };
      });
      card.querySelectorAll("[data-rename]").forEach(inp => inp.onchange = async () => {
        const v = inp.value.trim(); if (!v) return;
        await setCfg(table, { custom: { ...tcfg(table).custom, [inp.dataset.rename]: { ...tcfg(table).custom[inp.dataset.rename], label: v } } });
      });
      card.querySelectorAll("[data-remove]").forEach(btn => btn.onclick = async () => {
        if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "בטוח? הסר"; return; }
        const cus = { ...tcfg(table).custom }; delete cus[btn.dataset.remove];
        await setCfg(table, { custom: Object.keys(cus).length ? cus : null }); redraw();
      });
      const add = async () => {
        const l = card.querySelector("#ncLabel"); if (!l.value.trim()) { l.style.borderColor = "var(--warn)"; l.focus(); return; }
        const cid = newId(), cus = { ...(tcfg(table).custom || {}), [cid]: { label: l.value.trim(), type: card.querySelector("#ncType").value, order: Date.now() } };
        await setCfg(table, { custom: cus }); redraw(); card.querySelector("#ncLabel").focus();
      };
      card.querySelector("#ncAdd").onclick = add;
      card.querySelector("#ncLabel").onkeydown = e => { if (e.key === "Enter") add(); };
    };
    wire();
  });
}

/** בפרטי הקבלן: מאיזה חתך עד איזה חתך הוא עובד בכל קטע תכנון → אורך גזרה מדויק */
function secAssignBlock(d, c) {
  const ds = designOfC(d, c); if (!ds.length) return "";
  const L = lenOfC(d, c), dir = s => Number(s.secFrom) > Number(s.secTo);
  const rows = ds.map(x => { const a = c.secs?.[x.s.id] || {}, est = secSpan(x), inf = segAsgInfo(d, x.s), asg = secAsg(c, x.s.id);
    const ord = v => v ? (dir(x.s) ? [Math.round(v[1]), Math.round(v[0])] : [Math.round(v[0]), Math.round(v[1])]) : ["", ""];
    const [pf, pt] = ord(est), others = inf.asg.filter(y => y.c.id !== c.id && asg && y.r[0] < asg[1] && y.r[1] > asg[0]);
    const outR = asg && inf.has && (asg[0] < inf.lo || asg[1] > inf.hi);
    return `<tr><td><b>${esc(x.office?.name || "")} ${esc(x.s.num)}</b><div class="small muted">ק.ד. ${kdTxt(x.r)}</div></td>
      <td class="c small" dir="ltr">${x.s.secFrom !== "" ? `${esc(x.s.secFrom)}–${esc(x.s.secTo)}` : "—"}</td>
      <td><input class="inp num sa-in" inputmode="numeric" data-csec="${c.id}|${x.s.id}|from" value="${esc(a.from ?? "")}" placeholder="${pf === "" ? "חתך" : "≈" + pf}"></td>
      <td><input class="inp num sa-in" inputmode="numeric" data-csec="${c.id}|${x.s.id}|to" value="${esc(a.to ?? "")}" placeholder="${pt === "" ? "חתך" : "≈" + pt}"></td>
      <td class="c">${asg ? `<b>${num((asg[1] - asg[0]) * SECTION_M, 0)}</b> מ׳` : `<span class="muted">≈${x.len === null ? "—" : num(Math.round(x.len * 1000), 0)} מ׳</span>`}</td>
      <td>${asg ? `<span class="pill ok">מדויק</span>` : `<span class="pill">הערכה לפי ק.ד.</span>`}${outR ? ` <span class="pill warn">מחוץ לחתכי הקטע</span>` : ""}${others.map(y => ` <span class="pill warn">חופף ל${esc(y.c.name)}</span>`).join("")}</td></tr>`; }).join("");
  return `<div class="sa-box"><div class="row" style="gap:8px;align-items:baseline"><b>חלוקה לפי חתכים</b><span class="muted small">— מאיזה חתך עד איזה חתך הקבלן עובד בכל קטע תכנון. כשממולא, אורך הגזרה והאחוזים מחושבים מהחתכים (מדויק) במקום מהק.ד. האפור = הערכה לפי ק.ד.</span></div>
    <div class="tablewrap"><table class="sheet sa-t"><thead><tr><th>קטע תכנון</th><th>חתכי הקטע</th><th>מחתך</th><th>עד חתך</th><th>אורך</th><th>מצב</th></tr></thead><tbody>${rows}
      <tr class="sa-tot"><td colspan="4"><b>אורך גזרה</b> ${L?.exact ? `<span class="pill ok">כולו לפי חתכים</span>` : L?.some ? `<span class="pill warn">חלקו לפי ק.ד.</span>` : `<span class="pill warn">הערכה לפי ק.ד.</span>`}</td><td class="c"><b>${L ? (L.exact ? "" : "≈") + num(Math.round(L.km * 1000), 0) : "—"}</b> מ׳</td><td></td></tr></tbody></table></div></div>`;
}

function segAsgModal(segId) {

    ${all.map(c => { const a = c.secs?.[s.id] || {}; return `<tr ${cs.includes(c) ? "" : `class="muted"`}><td><span class="ndot" style="--d:${cColor(d, c)};display:inline-block"></span> <b>${esc(c.name)}</b></td>
      <td><input class="inp num sa-in" inputmode="numeric" data-mf="${c.id}" value="${esc(a.from ?? "")}"></td><td><input class="inp num sa-in" inputmode="numeric" data-mt="${c.id}" value="${esc(a.to ?? "")}"></td></tr>`; }).join("")}</tbody></table>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn ghost" id="mNo">ביטול</button><button class="btn" id="mOk">שמירה</button></div>`,
    (m, close) => { m.querySelector("#mNo").onclick = close;

        for (const c of all) { const f = m.querySelector(`[data-mf="${c.id}"]`).value.trim(), t = m.querySelector(`[data-mt="${c.id}"]`).value.trim(), prev = c.secs?.[s.id] || {};

function pageSegments(d) {
  if (!d.designOffices.length) return `<h1>קטעי תכנון</h1><div class="card"><p>אין עדיין נתונים.</p><button class="btn" data-act="upBackup">טעינת קובץ נתונים</button></div>`;

  const offs = d.designOffices, oc = o => o.color || "#eef0eb";

      <div class="sg-row sg-c">${mains.map(c => { const r = kdRange(c); return r ? `<div class="sg-b" style="${pos(r.lo, r.hi)};--bc:${cColor(d, c)}" title="${esc(c.name)} · ק.ד. ${kdTxt(r)}"><span>${esc(c.name)}</span></div>` : ""; }).join("")}</div>
      <div class="sg-row">${all.map(x => { const r = kdRange(x), o = offs.find(q => q.id === x.officeId); return r ? `<div class="sg-s" style="${pos(r.lo, r.hi)};--bc:${oc(o || {})}" title="${esc(o?.name || "")} ${esc(x.num)} · ק.ד. ${kdTxt(r)} · ${lenOf(x) ? MTR(lenOf(x).v) : ""}"><span>${esc(o?.name || "")} ${esc(x.num)}</span></div>` : ""; }).join("")}</div>

  const mainsOf = r => mains.filter(c => overlap(kdRange(c), r)).map(c => `<span class="sa-chip" style="--cc:${cColor(d, c)}">${esc(c.name)}</span>`).join(" ");
  const block = o => {

    const len = segs.reduce((s, x) => s + (lenOf(x)?.v || 0), 0), rs = segs.map(kdRange).filter(Boolean);

    const cs = r ? mains.filter(c => overlap(kdRange(c), r)) : [], miss = segs.filter(x => secLenKm(x) === null).length;

          <div class="sg-chips"><span><b>${segs.length}</b> קטעים</span><span><b>${MTR(len)}</b></span>${r ? `<span>ק.ד. <b>${kdTxt(r)}</b></span>` : ""}${miss ? `<span class="w">${miss} בלי חתכים</span>` : ""}
            ${cs.map(c => `<span class="sg-cc" style="--cc:${cColor(d, c)}">${esc(c.name)}</span>`).join("")}</div></div>

        <td class="c nowrap">${x.r ? kdTxt(x.r) : "—"}</td><td>${x.r ? mainsOf(x.r) : "—"}</td></tr>`).join("")}
      <tr class="sg-tot"><td><b>סה״כ</b></td><td class="c"><b>${all.length}</b></td><td class="c"><b style="font-size:16px">${num(Math.round(totLen * 1000), 0)}</b></td><td class="c">100%</td><td class="c nowrap">${kAll.length ? `${Math.round(LO)}–${Math.round(HI)}` : "—"}</td><td></td></tr></tbody></table></div></div>`; })()}

  ${offs.map(block).join("")}
  <button class="btn ghost" data-act="addOffice">+ משרד תכנון</button>`;
}

/* ---------- כפילויות בדיווח ביצוע: אותו קבלן + מלאכה + קטע, חתכים חופפים ---------- */
const ivOfP = p => [Math.min(+p.secFrom, +p.secTo), Math.max(+p.secFrom, +p.secTo)];
const hasSecs = p => p.secFrom !== "" && p.secTo !== "" && p.secFrom != null && p.secTo != null && !isNaN(p.secFrom) && !isNaN(p.secTo);
function progPrior(cid, aid, sid, exceptId) { return list("progress").filter(p => p.id !== exceptId && p.contractorId === cid && p.activityId === aid && p.segmentId === sid && p.review !== "נדחה" && hasSecs(p)); }
function mergeIvs(ivs) { const s = ivs.slice().sort((a, b) => a[0] - b[0]), out = []; for (const [a, b] of s) { const L = out[out.length - 1]; if (L && a <= L[1]) L[1] = Math.max(L[1], b); else out.push([a, b]); } return out; }
function gapsOf(lo, hi, cov) { const g = []; let x = lo; for (const [a, b] of cov) { if (b <= x) continue; if (a >= hi) break; if (a > x) g.push([x, Math.min(a, hi)]); x = Math.max(x, b); if (x >= hi) break; } if (x < hi) g.push([x, hi]); return g; }
function progOverlaps(p) { if (!hasSecs(p)) return []; const [lo, hi] = ivOfP(p); return progPrior(p.contractorId, p.activityId, p.segmentId, p.id).filter(q => { const [a, b] = ivOfP(q); return a < hi && b > lo; }); }

async function placeActivity(cid, id, N, mode) {
  const acts = list("activities").filter(a => a.contractorId === cid);
  const ord = new Map(acts.map(a => [a.id, Number(a.order) || 0]));
  if (mode === "shift") for (const [k, v] of ord) if (k !== id && v >= N) ord.set(k, v + 1);
  ord.set(id, N);
  const vals = [...new Set(ord.values())].sort((a, b) => a - b), seq = new Map(vals.map((v, i) => [v, i + 1]));
  for (const a of acts) { const nv = seq.get(ord.get(a.id)); if (Number(a.order) !== nv) await api.update("activities", a.id, { order: nv }); }
}
