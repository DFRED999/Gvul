<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בקרת ביצוע מכשול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* פריסה: תפריט ימני כהה בקבוצות + אזור עבודה בהיר. טבלאות בסגנון גיליון העבודה. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1b2127; --muted: #646d76; --line: #dcdfd8;
  --accent: #2f6b4f; --warn: #b5541c; --head: #d9ecf7; --head-ink: #17384d;
  --side: #1d2a23; --side-ink: #dfe7e1; --side-hover: #2a3b31; --side-on: #34503f; --side-muted: #9fb3a6;
  --radius: 10px; color-scheme: light;
  font-family: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
button, input, select, textarea { font: inherit; color: inherit; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { font-weight: 800; font-size: 18px; color: #fff; padding: 0 10px 14px; line-height: 1.25; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--side-muted); margin-top: 2px; }
.grp { font-size: 11.5px; letter-spacing: .04em; color: var(--side-muted); padding: 12px 12px 4px; }
.nav { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 8px; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; }
.nav:hover { background: var(--side-hover); }
.nav.on { background: var(--side-on); color: #fff; font-weight: 600; }
.nav .soon { font-size: 10.5px; color: var(--side-muted); border: 1px solid #3c5446; border-radius: 999px; padding: 0 6px; }
.nav:focus-visible, .btn:focus-visible, .tab:focus-visible { outline: 2px solid #8fc4a6; outline-offset: 2px; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 12px 10px 0; word-break: break-all; }
.side .foot button { all: unset; cursor: pointer; text-decoration: underline; }
.main { padding: 26px 30px 60px; width: 100%; min-width: 0; }
.banner { background: #fff6e5; border: 1px solid #f0d9a8; color: #6d4b0b; border-radius: var(--radius); padding: 10px 14px; font-size: 14px; margin-bottom: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mtop, .mscrim { display: none; }
@media (max-width: 860px) {
  /* נייד: פס עליון עם ☰ — התפריט נפתח כמגירה מהצד */
  .mtop { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30; background: var(--side); color: #fff; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
  .mbtn { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; background: rgba(255,255,255,.08); }
  .mbtn span { display: block; width: 22px; height: 2.5px; border-radius: 2px; background: #fff; }
  .mt-brand { font-size: 17px; } .mt-page { color: var(--side-muted); font-size: 14px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .mt-badge { all: unset; cursor: pointer; background: #c4472b; color: #fff; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 3px 10px; }
  .mscrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .mscrim.on { opacity: 1; pointer-events: auto; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(300px, 84vw); z-index: 50; overflow-y: auto; transform: translateX(105%); transition: transform .22s ease; padding-top: max(18px, env(safe-area-inset-top)); box-shadow: -8px 0 24px rgba(0,0,0,.3); }
  .side.open { transform: none; }
  .side .nav { padding: 11px 12px; font-size: 16px; }
  .main { padding: 18px 16px 60px; }
  .svsticky { top: 60px; }
}

h1 { font-size: 26px; margin: 0 0 4px; font-weight: 800; text-wrap: balance; }
h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; max-width: 75ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); } .small { font-size: 13px; } .nowrap { white-space: nowrap; }
.btn { border: 0; border-radius: 8px; padding: 8px 15px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid #c9cdc5; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.del { background: transparent; color: var(--warn); padding: 3px 8px; font-weight: 500; font-size: 13px; }
.btn.del.armed { background: var(--warn); color: #fff; font-weight: 700; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: #eceee9; color: #3b4249; white-space: nowrap; }
.pill.warn { background: #fbe9dd; color: #8a3d12; } .pill.ok { background: #e1efe6; color: #24553d; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.tab { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 999px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select, .inp { border: 1px solid #cfd3cc; border-radius: 8px; padding: 8px 10px; background: #fff; font-size: 14px; color: var(--ink); min-width: 0; }

/* ---------- טבלת קטעי תכנון — בסגנון הגיליון ---------- */
.office { margin-bottom: 22px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.office-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.office-head .name { font-size: 18px; font-weight: 800; }
.office-head .tot { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* הטבלה גוללת בתוך מסגרת בגובה החלון — כך שורת הכותרות (והסינון) נשארת קבועה למעלה */
.tablewrap { overflow: auto; max-height: calc(100vh - 80px); }
.sheet thead { position: sticky; top: 0; z-index: 3; box-shadow: 0 2px 0 #c3d9e6; }
.sheet { border-collapse: collapse; width: 100%; font-size: 14px; }
.sheet th { background: var(--head); color: var(--head-ink); font-weight: 700; font-size: 13px; padding: 7px 6px; border: 1px solid #c3d9e6; white-space: nowrap; text-align: center; }
.sheet td { border: 1px solid var(--line); padding: 3px 4px; vertical-align: middle; }
.sheet td.c { text-align: center; }
.sheet td.kd { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.sheet .cell { all: unset; box-sizing: border-box; width: 100%; padding: 5px 6px; border-radius: 5px; min-width: 0; }
.sheet .cell:hover { background: #f4f7f0; }
.sheet .cell:focus { background: #fffbe8; outline: 1px solid #e3cf86; }
/* מספרים ותאריכים: תמיד בשורה אחת ובמלואם */
.sheet input.cell { field-sizing: content; min-width: 100%; white-space: nowrap; }
.sheet input.cell[type="date"] { min-width: 132px; }
/* טקסט: נשבר לשורות, העמודה מתרחבת עד 320 פיקסלים ואז הטקסט ממשיך בשורה הבאה */
.sheet textarea.cell { display: block; field-sizing: content; width: auto; min-width: 100%; max-width: 320px; white-space: pre-wrap; overflow-wrap: break-word; line-height: 1.35; resize: none; overflow: hidden; }
@supports not (field-sizing: content) { .sheet textarea.cell { width: 100%; min-width: 150px; } }
.sheet td.w-text { min-width: 220px; }
.sheet .filtrow th { background: #eef4f8; padding: 3px 4px; }
.sheet .finp { width: 100%; min-width: 60px; box-sizing: border-box; font: inherit; font-size: 12px; font-weight: 400; padding: 3px 6px; border: 1px solid #c3d9e6; border-radius: 5px; background: #fff; }
.sheet .finp.on { border-color: var(--accent); background: #f1f8f2; }
.sheet .fcount { font-size: 11px; font-weight: 400; white-space: nowrap; }
.btn.sm.on { background: var(--accent); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; background: #fff; cursor: pointer; }
.chip:has(input:checked) { background: #e7f2ea; border-color: var(--accent); }
.ofT { font-size: .62em; font-weight: 500; opacity: .75; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px; }
.kpi { background: #f7f8f5; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi span { font-size: 12px; color: var(--muted, #6b7064); } .kpi b { font-size: 22px; font-variant-numeric: tabular-nums; } .kpi small { font-size: 12px; color: var(--muted, #6b7064); }
.viewtabs { display: inline-flex; gap: 4px; margin: 0 0 10px; }
.sheet input.num { text-align: center; font-variant-numeric: tabular-nums; }
.sheet input.kdin { text-align: center; font-weight: 800; }
.sheet .w-place { min-width: 150px; width: 22%; }
.sheet .w-num { width: 54px; } .sheet .w-len { width: 70px; } .sheet .w-sec { width: 64px; } .sheet .w-kd { width: 66px; }
.sec { display: flex; align-items: center; gap: 2px; direction: ltr; justify-content: center; }
.sec input.cell { width: 64px; min-width: 64px; flex: 0 0 auto; text-align: center; font-variant-numeric: tabular-nums; }   /* בלי זה השדה מקבל רוחב 100% וגולש לעמודות השכנות */
.calc { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
.maplink { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 13px; }
.maplink a { color: #2a6a3c; }
.maplink button { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; padding: 0 3px; border-radius: 4px; }
.maplink button:hover { background: #eef0eb; }
.maplink .empty { color: #a3a9ad; }
.sheet th.colbtn { background: var(--head); width: 1%; }
.sheet th.colbtn .btn { font-size: 12px; padding: 2px 8px; background: #fff; }
.collist { display: flex; flex-direction: column; gap: 4px; max-height: 50vh; overflow: auto; }
.colrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }
.colrow { cursor: grab; background: var(--surface); }
.colrow.dragging { opacity: .4; }
.colrow.over { border-color: var(--accent); box-shadow: inset 0 2px 0 var(--accent); }
.colrow .grip { color: #a3a9ad; letter-spacing: -2px; font-size: 13px; }
.colrow .mv { all: unset; cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); font-size: 11px; }
.colrow .mv:hover:not(:disabled) { background: #eef0eb; color: var(--ink); }
.colrow .mv:disabled { opacity: .25; cursor: default; }
.colrow .mv:focus-visible { outline: 2px solid var(--accent); }
.pform { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 12px; align-items: end; }
details summary { cursor: pointer; }
/* צבעי סטטוס הנושאים — אותה שפה כמו בפריטים: פתוח לבן · בטיפול צהוב · HOLD כתום · סגור ירוק */
select.st-0 { background: #fff; } select.st-1 { background: #f7e08f; } select.st-2 { background: #f5b48f; font-weight: 600; } select.st-3 { background: #a8d8b0; }
.drop { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; border: 2px dashed #b9c4b2; border-radius: 10px; padding: 16px; margin-bottom: 14px; background: #fafbf8; cursor: pointer; }
.drop.over, .drop:hover { border-color: var(--accent); background: #eef5f0; }
.modal .card.wide { max-width: 980px; max-height: 90vh; overflow: auto; }
.modal h3 { font-size: 15px; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.replist { margin: 0; padding-inline-start: 20px; font-size: 13.5px; display: grid; gap: 3px; }
.sumrow { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 6px; }
.sumrow textarea { width: 100%; font-size: 13px; resize: vertical; }
.addcol { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.sheet tfoot td { background: #f7f8f5; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- סקירה + חוצץ קבלן ---------- */
.cards4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-bottom: 16px; }
.ccard { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.ccard:hover { border-color: var(--accent); }
.addcard { border-style: dashed; justify-content: center; align-items: center; min-height: 120px; color: var(--accent); }
.nav.addnav { color: #b9d8c5; font-size: 13.5px; }
.ccard:focus-visible { outline: 2px solid var(--accent); }
.cname { font-size: 18px; font-weight: 800; }
.cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.cgrid span { display: block; font-size: 12px; color: var(--muted); }
.cgrid b { font-variant-numeric: tabular-nums; font-size: 15px; }
.form6 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.stats { gap: 22px; margin: 14px 0 12px; font-size: 14px; }
/* old */ .stripwrap { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: start; }
.striplabels div { display: flex; align-items: center; font-size: 12.5px; color: var(--muted); font-weight: 600; }
svg.strip { width: 100%; height: auto; min-height: 90px; display: block; }
svg.strip text { font-size: 12px; fill: var(--muted); font-family: inherit; }
svg.strip text.in { fill: var(--ink); font-weight: 600; font-size: 12.5px; }

.banner.databar { background: var(--surface); border-color: var(--line); color: var(--ink); }
.office-head input.oname { all: unset; font-size: 19px; font-weight: 800; border-radius: 6px; padding: 2px 6px; field-sizing: content; min-width: 4ch; cursor: text; }
.office-head input.oname:hover { background: #ffffff88; } .office-head input.oname:focus { background: #fff; outline: 1px solid #e3cf86; }
/* קטעי תכנון: כל טבלאות המשרדים באותם רוחבי עמודות — קומפקטי ואחיד */
table.sheet[data-table="designSegments"] { width: auto; }
section.office { width: fit-content; max-width: 100%; } section.office .tablewrap { max-height: none; }
table.sheet[data-table="designSegments"] [data-k="num"] { width: 80px; min-width: 80px; max-width: 80px; }
table.sheet[data-table="designSegments"] [data-k="fromPlace"] { width: 150px; min-width: 150px; max-width: 150px; }
table.sheet[data-table="designSegments"] [data-k="toPlace"] { width: 150px; min-width: 150px; max-width: 150px; }
table.sheet[data-table="designSegments"] [data-k="kdFrom"] { width: 95px; min-width: 95px; max-width: 95px; }
table.sheet[data-table="designSegments"] [data-k="kdFromUrl"] { width: 120px; min-width: 120px; max-width: 120px; }
table.sheet[data-table="designSegments"] [data-k="kdTo"] { width: 95px; min-width: 95px; max-width: 95px; }
table.sheet[data-table="designSegments"] [data-k="kdToUrl"] { width: 120px; min-width: 120px; max-width: 120px; }
table.sheet[data-table="designSegments"] [data-k="sections"] { width: 190px; min-width: 190px; max-width: 190px; }
table.sheet[data-table="designSegments"] [data-k="lengthKm"] { width: 190px; min-width: 190px; max-width: 190px; }
table.sheet[data-table="designSegments"] th.colbtn, table.sheet[data-table="designSegments"] td:last-child { width: 210px; min-width: 210px; }
table.sheet[data-table="designSegments"] td[data-k="num"] input, table.sheet[data-table="designSegments"] td[data-k^="kd"] input { text-align: center; }
button.manlen { border: 0; cursor: pointer; font: inherit; font-size: 11.5px; } button.manlen:hover { background: #f5c9ad; }
tr.mrow { cursor: pointer; } tr.mrow:hover td { filter: brightness(.97); }
tr.msub td:first-child .msind { padding-inline-start: 18px; font-size: 13.5px; }
.svchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.svchip { border: 1px solid #c9cdc5; background: #fff; border-radius: 10px; padding: 10px 14px; font: inherit; font-size: 15px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 88px; }
.svchip small { font-size: 11.5px; color: var(--muted); } .svchip.on { background: var(--accent); color: #fff; border-color: var(--accent); } .svchip.on small { color: #e3efe6; }
.svcard { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 12px; margin: 6px 0 10px; }
.svhead { display: flex; align-items: center; gap: 8px; } .svwhere { flex: 1; text-align: center; display: flex; flex-direction: column; } .svwhere b { font-size: 17px; } .svwhere span { font-size: 13px; color: var(--muted); }
.svnav { padding: 12px 16px; font-size: 16px; min-width: 92px; }
.svrange { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #f4f7f0; border-radius: 10px; padding: 8px 10px; }
.svrange input { width: 90px; font: inherit; font-size: 20px; font-weight: 700; text-align: center; padding: 6px; border: 1px solid #c9cdc5; border-radius: 8px; direction: ltr; }
.svkd { font-size: 14px; font-weight: 600; color: #2f6db5; } .svrk { margin-top: 6px; background: #eef4fb; } .svrk input { font-size: 17px; width: 100px; }
.svsticky { position: sticky; top: 0; z-index: 6; background: var(--surface); margin: -12px -12px 0; padding: 12px 12px 8px; border-radius: 14px 14px 0 0; box-shadow: 0 6px 10px -8px rgba(0,0,0,.25); }
.agrp { margin-top: 14px; } .agh { display: flex; align-items: center; gap: 8px; color: var(--g); font-size: 16px; padding-bottom: 6px; margin-bottom: 8px; border-bottom: 2px solid var(--g); }
.agi { display: inline-flex; width: 34px; height: 34px; border-radius: 10px; background: var(--gt); align-items: center; justify-content: center; } .agi svg { width: 22px; height: 22px; }
.agc { margin-inline-start: auto; font-size: 12.5px; color: var(--muted); font-weight: 700; background: var(--gt); border-radius: 999px; padding: 2px 9px; }
.svact { background: #fff; border-inline-start: 5px solid var(--g, #ccc) !important; transition: background .12s, transform .06s; } .svact:active { transform: scale(.97); }
.svact .sb { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #d5d9d1; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
.svact.stok { background: #e3f3e7; } .svact.stok .sb { background: #2e7d4f; border-color: #2e7d4f; color: #fff; }
.svact.stno { background: #f1f1ef; color: #6b6b6b; } .svact.stno .sb { background: #8c8c8c; border-color: #8c8c8c; color: #fff; }
.svact.sthalf { background: #fdf6db; } .svact.sthalf .sb { background: #e2b93b; border-color: #e2b93b; color: #fff; font-size: 15px; }
.svgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.svact { border: 1px solid #c9cdc5; border-radius: 10px; padding: 10px; min-height: 64px; font: inherit; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 6px; text-align: right; touch-action: manipulation; }
.svact b { font-size: 24px; min-width: 1.2em; }
.svpm { font-size: 20px; padding: 6px 14px; }

<div id="app"></div>

<script>
/* =====================================================================
   הגדרות Firebase — מדביקים כאן את הערכים מ-Firebase Console.
   כל עוד apiKey ריק — האתר עובד במצב הדגמה (נתונים בדפדפן בלבד).
   ===================================================================== */
const FIREBASE_CONFIG = { apiKey: "AIzaSyDDRcdT0My1ZIhtE04GGL5silY3QYyWPDw", authDomain: "gvul-950ce.firebaseapp.com", databaseURL: "https://gvul-950ce-default-rtdb.europe-west1.firebasedatabase.app", projectId: "gvul-950ce", storageBucket: "gvul-950ce.firebasestorage.app", messagingSenderId: "467547105884", appId: "1:467547105884:web:1664970f7b2db52bc55499" };
const DB_ROOT = "border";
const SECTION_M = 20;          // מרחק בין חתכים (מ׳) — קבוע

/* נתוני הפרויקט לא נמצאים בקוד — הם נקראים מהקובץ data.json (ראה שכבת נתונים). */

/* =====================================================================
   עזרים
   ===================================================================== */
const COLS = ["contractors", "orders", "designOffices", "designSegments", "activities", "progress", "deliveries", "issues", "meetings", "items", "kdSections", "iecOrders", "alerts", "survey", "tableConfig", "users"];
/* קבלנים ייעודיים — עובדים לרוחב הקו לפי התמחות (שערים, מבני חשמל, פינוי מוקשים, סבכות…) ומנוהלים לפי "פריטי עבודה" */
const SPECIALTIES = ["ארון שקד", "חדר טרפו", "תט״ז", "שערים", "פינוי מוקשים", "סבכות למעבירי מים", "תקשורת", "מעבירי מים", "מעביר אירי", "אחר"];
const ITEM_STATUS = ["טרם", "מתוכנן", "בביצוע", "הושלם", "HOLD", "מבוטל"];
/** צבע רקע לשורה שלמה לפי הסטטוס (גוון בהיר של צבע הסטטוס) */
const ROW_TINT = {
  items: { "מתוכנן": "#edf4fc", "בביצוע": "#fdf6db", "הושלם": "#e6f4e9", "HOLD": "#fde9de", "מבוטל": "#f1f1ef" },
  issues: { "בטיפול": "#fdf6db", "HOLD": "#fde9de", "סגור": "#e6f4e9" } };
const rowTintProg = r => r.review === "לבדיקה" ? "#fdf6db" : r.review === "נדחה" ? "#f1f1ef" : "";
const rowTint = (table, r) => table === "iecOrders" ? (IEC_TINT[r.stage] || "") : table === "progress" ? rowTintProg(r) : table === "activities" ? (stageGroup(r.stage)?.tint || "") : ROW_TINT[table]?.[r.status] || "";
const ITEM_COLORS = { "טרם": "#ffffff", "מתוכנן": "#cfe2f7", "בביצוע": "#f7e08f", "הושלם": "#a8d8b0", "HOLD": "#f5b48f", "מבוטל": "#e4e4e1" };
const isMain = c => c.kind !== "ייעודי";
const specsOf = c => String(c.specialties || "").split("·").map(x => x.trim()).filter(Boolean);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (x, dg = 2) => x === null || x === undefined || x === "" || isNaN(x) ? "" : Number(x).toLocaleString("he-IL", { maximumFractionDigits: dg });
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name ?? "").localeCompare(String(b.name ?? ""), "he");
/** אורך לפי חתכים: (חתך סוף − חתך התחלה) × 20 מ׳ */
const secLenKm = s => (s.secFrom === "" || s.secTo === "" || s.secFrom == null || s.secTo == null || isNaN(s.secFrom) || isNaN(s.secTo))
  ? null : Math.abs(Number(s.secTo) - Number(s.secFrom)) * SECTION_M / 1000;
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const fmtD = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(2, 4)}` : "";
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";

/* =====================================================================
   שכבת נתונים
   הנתונים לא נמצאים בקוד. האתר קורא אותם מהקובץ data.json שיושב ליד index.html.
   - בלי Firebase: עותק עבודה נשמר בדפדפן. כדי לשתף/לשמור — מורידים גיבוי ומעלים אותו ל-GitHub בשם data.json.
   - עם Firebase: הנתונים חיים ב-Firebase; data.json משמש לטעינה ראשונה ולגיבוי.
   ===================================================================== */
const LOCAL = !FIREBASE_CONFIG.apiKey;
const DATA_FILE = "data.json";
const LS_KEY = "border-site-work-v1";
const DATA_COLS = COLS.filter(c => c !== "users");
let RAW = Object.fromEntries(COLS.map(c => [c, {}]));
let META = { savedAt: null, backupAt: null, source: "" };
let NEWER_FILE = null;            // data.json חדש יותר שנמצא באתר בזמן שיש שינויים מקומיים
let fb = null, user = null, me = null;

const D = () => Object.fromEntries(COLS.map(c => [c, list(c)]));
const list = col => Object.entries(RAW[col] || {}).map(([id, v]) => ({ id, ...v })).sort(byOrder);
const stamp = () => ({ updatedAt: new Date().toISOString(), updatedBy: user?.email || "מקומי" });
const dataOnly = () => Object.fromEntries(DATA_COLS.map(c => [c, RAW[c] || {}]));
const isBackup = j => j && typeof j === "object" && j.data && typeof j.data === "object" && DATA_COLS.some(c => j.data[c]);
const counts = data => DATA_COLS.map(c => Object.keys(data[c] || {}).length);
const dirty = () => !!META.savedAt && META.savedAt !== META.backupAt;
const fmtTime = iso => iso ? new Date(iso).toLocaleString("he-IL", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";

function storeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ meta: META, data: dataOnly() })); } catch {} }
function touched() { META.savedAt = new Date().toISOString(); if (LOCAL) { META.source = "עותק עבודה בדפדפן"; storeLocal(); } }
function applyData(data, source, savedAt, backedUp) {
  for (const c of DATA_COLS) RAW[c] = data[c] || {};
  META = { savedAt: savedAt || new Date().toISOString(), backupAt: backedUp ? (savedAt || null) : META.backupAt, source };
}

/** Firebase לא מקבל במפתחות את התווים . # $ [ ] / — מחליפים ב-_ (גם בהפניות itemId) */
const fbKey = k => String(k).replace(/[.#$\[\]\/]/g, "_");
const fbSafe = o => Array.isArray(o) ? o.map(fbSafe) : o && typeof o === "object" ? Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined).map(([k, v]) => [fbKey(k), k === "itemId" && typeof v === "string" ? fbKey(v) : fbSafe(v)])) : o;
const refOf = (col, id) => fb.database().ref(col === "users" ? `${DB_ROOT}_access/${id}` : `${DB_ROOT}/${col}/${id}`);
const api = {
  async add(col, obj) {
    const id = newId();
    if (col === "issues" && !obj.code) obj = { ...obj, code: nextIssueCode(obj.contractorId) };
    if (LOCAL) { RAW[col][id] = { ...obj, ...stamp() }; touched(); render(); return id; }
    await refOf(col, id).set(fbSafe({ ...obj, ...stamp() })); return id;
  },
  async update(col, id, patch) {
    if (LOCAL) { RAW[col][id] = { ...RAW[col][id], ...patch, ...stamp() }; touched(); render(); return; }
    await refOf(col, id).update(fbSafe({ ...patch, ...stamp() }));
  },
  async put(col, id, obj) {
    if (LOCAL) { if (obj === null) delete RAW[col][id]; else RAW[col][id] = obj; touched(); render(); return; }
    await refOf(col, id).set(obj === null ? null : fbSafe(obj));
  },
  async remove(col, id) {
    if (LOCAL) { delete RAW[col][id]; touched(); render(); return; }
    await refOf(col, id).remove();
  },
  /** החלפת כל הנתונים (מגיבוי) */
  async replaceAll(data, source, savedAt) {
    if (LOCAL) { applyData(data, source, savedAt, true); storeLocal(); render(); return; }
    await fb.database().ref(DB_ROOT).set(fbSafe(Object.fromEntries(DATA_COLS.map(c => [c, data[c] || {}]))));
    META.source = source;
  },
};

/* ---------- קריאת data.json ---------- */
async function fetchDataFile() {
  try {
    const r = await fetch(`${DATA_FILE}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    return isBackup(j) ? j : null;
  } catch { return null; }
}
function readLocal() { try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "null"); return isBackup(j) ? j : null; } catch { return null; } }

/** בחירה בין data.json לעותק העבודה בדפדפן — החדש מביניהם, בלי לאבד שינויים שלא גובו */
async function loadLocalMode() {
  const file = await fetchDataFile(), local = readLocal();
  const fileAt = file?.meta?.savedAt || "", localAt = local?.meta?.savedAt || "";
  const localDirty = local && local.meta?.savedAt !== local.meta?.backupAt;
  if (local && (!file || localAt >= fileAt || localDirty)) {
    applyData(local.data, "עותק עבודה בדפדפן", local.meta.savedAt, false);
    META.backupAt = local.meta.backupAt || null;
    if (file && fileAt > localAt) NEWER_FILE = file;
  } else if (file) {
    applyData(file.data, "data.json", file.meta?.savedAt, true); storeLocal();
  } else {
    META.source = "";
  }
}

/* ---------- גיבוי: הורדה וטעינה ---------- */
function downloadJson(name) {
  const now = new Date().toISOString();
  const j = { meta: { app: "border-barrier", format: 1, savedAt: META.savedAt || now, savedBy: user?.email || "מקומי", exportedAt: now }, data: dataOnly() };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(j, null, 1)], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  META.backupAt = META.savedAt; if (LOCAL) storeLocal(); render();
}
const backupName = () => `border-backup-${new Date().toISOString().slice(0, 16).replace("T", "_").replace(":", "")}.json`;

function pickBackupFile() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let j; try { j = JSON.parse(rd.result); } catch { return alertModal("הקובץ אינו JSON תקין."); }
      if (!isBackup(j)) return alertModal("הקובץ לא נראה כמו גיבוי של האתר הזה (חסר בו שדה data עם קבלנים / הזמנות / קטעים).");
      confirmReplace(j, `קובץ ${f.name}`);
    };
    rd.readAsText(f);
  };
  inp.click();
}
function confirmReplace(j, label) {
  const [c, o, of, s] = counts(j.data);
  modal(`<h2>טעינת נתונים</h2>
    <p>${esc(label)}${j.meta?.savedAt ? ` · נשמר ${fmtTime(j.meta.savedAt)}` : ""}</p>
    <p class="small">${c} קבלנים · ${o} הזמנות · ${of} משרדי תכנון · ${s} קטעי תכנון</p>
    <p><b>כל הנתונים הנוכחיים באתר יוחלפו בנתוני הקובץ.</b> מומלץ להוריד קודם גיבוי של המצב הנוכחי.</p>
    <label class="row small"><input type="checkbox" id="mAgree"> הבנתי שהנתונים הנוכחיים יוחלפו</label>
    <div class="row"><button class="btn" style="background:var(--warn)" id="mYes" disabled>החלף את הנתונים</button><button class="btn ghost" id="mNo">ביטול</button>
    <span class="spacer"></span><button class="btn ghost sm" id="mBk">הורד גיבוי של המצב הנוכחי</button></div>`,
    (m, close) => {
      const yes = m.querySelector("#mYes");
      m.querySelector("#mAgree").onchange = e => yes.disabled = !e.target.checked;
      m.querySelector("#mNo").onclick = close;
      m.querySelector("#mBk").onclick = () => downloadJson(backupName());
      yes.onclick = async () => { close(); NEWER_FILE = null; await api.replaceAll(j.data, label, j.meta?.savedAt); };
    });
}
function newContractorModal() {
  modal(`<h2>קבלן חדש</h2>
    <label class="field">שם הקבלן<input id="nc_name" required></label>

const kdNum = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };

/** תצוגת אורך במטרים (הנתונים נשמרים בק״מ) */
const MTR = km => km === null || km === undefined || km === "" || isNaN(km) ? "—" : num(Math.round(Number(km) * 1000), 0) + " מ׳";

/** קטעי תכנון שבתוך גזרת קבלן — כולל חלק של קטע שנחתך בין קבלנים */
function designInRange(d, range) {
  if (!range) return [];
  return d.designSegments.map(s => {
    const r = kdRange(s), ov = overlap(r, range); if (!ov) return null;
    const frac = (ov.hi - ov.lo) / (r.hi - r.lo), L = lenOf(s);
    return { s, r, ov, full: frac > 0.999, frac, len: L ? L.v * frac : null, office: d.designOffices.find(o => o.id === s.officeId) };
  }).filter(Boolean).sort((a, b) => b.ov.hi - a.ov.hi);
}
/** כיסוי הגזרה ע״י הזמנות + פערים */
function coverage(range, orders) {
  if (!range) return null;
  const parts = orders.map(o => overlap(kdRange(o), range)).filter(Boolean).sort((a, b) => a.lo - b.lo);
  const merged = [];
  for (const p of parts) { const l = merged.at(-1); if (l && p.lo <= l.hi) l.hi = Math.max(l.hi, p.hi); else merged.push({ ...p }); }
  const covered = merged.reduce((s, p) => s + p.hi - p.lo, 0);
  const gaps = []; let cur = range.lo;
  for (const p of merged) { if (p.lo > cur) gaps.push({ lo: cur, hi: p.lo }); cur = Math.max(cur, p.hi); }

/* ---------- פס הקו (SVG): ק.ד. גבוה בימין, יורד שמאלה ---------- */
/* ---------- פס הקו (HTML): ק.ד. גבוה מימין, יורד שמאלה. שורות בגובה קבוע, פריטים חופפים בשורות-משנה ---------- */
function strip(range, rows, legend = "") {
  const span = range.hi - range.lo, LH = 30;
  const pos = kd => (kd - range.lo) / span * 100;                       // 0% = ק.ד. נמוך (שמאל), 100% = גבוה (ימין)
  const ticks = new Set([range.lo, range.hi]);
  rows.forEach(r => r.items.forEach(i => { ticks.add(Math.max(i.lo, range.lo)); ticks.add(Math.min(i.hi, range.hi)); }));
  const tk = [...ticks].sort((a, b) => b - a); let last = 999;
  const tickEls = tk.map(t => { const p = pos(t), show = last - p >= 4.5 || p === 0; if (show) last = p;
    return `<span class="sgrid" style="left:${p}%"></span>${show ? `<span class="stick" style="left:${p}%">${num(t, span > 20 ? 0 : 1)}</span>` : ""}`; }).join("");
  const rowEls = rows.map(r => {
    const items = [...r.items].sort((a, b) => b.hi - a.hi), lanes = [];
    for (const it of items) { let l = lanes.findIndex(end => end >= it.hi - 1e-9); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = it.lo; it._lane = l; }

        return `<button class="sblk ${i.light ? "light" : ""}" data-act="blk" data-info="${esc(i.info || i.title || i.text)}" title="${esc(i.title || i.text)}"

    </div></div>`;
  }).join("");

    ${legend ? `<div class="slegend">${legend}</div>` : ""}</div>`;
}

/* ---------- קליטת קובץ סיכום (PDF / Word / טקסט) ---------- */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function fileToLines(file) {
  const name = file.name.toLowerCase(), buf = await file.arrayBuffer();
  if (name.endsWith(".pdf")) {
    if (!window.pdfjsLib) { await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }   // worker בתוך הדף
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    const lines = [];
    for (let i = 1; i <= doc.numPages; i++) lines.push(...pdfItemsToLines((await (await doc.getPage(i)).getTextContent()).items));
    return lines;
  }
  if (name.endsWith(".docx")) {
    if (!window.mammoth) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    const r = await mammoth.extractRawText({ arrayBuffer: buf });
    return r.value.split(/\n+/).map(s => s.trim()).filter(Boolean);
  }
  return new TextDecoder().decode(buf).split(/\n+/).map(s => s.trim()).filter(Boolean);
}
const guessCat = sec => /חשמל|תקשורת/.test(sec) ? "חשמל ותקשורת" : /בטיחות|אבטחה/.test(sec) ? "בטיחות ואבטחה" : /מעביר/.test(sec) ? "מעבירי מים" : /שער/.test(sec) ? "שערים ומעברים" : "תכנון";
function holdFor(txt, issue) {   // HOLD רק אם מופיע באותו משפט עם המיקום של הנושא
  if (!HOLD_RE.test(txt)) return false; if (!issue) return true;
  const ns = numbersIn(issue.title + " " + issue.kdFrom + " " + issue.kdTo); const all = [...ns.kd, ...ns.sec].map(String);
  return txt.split(/[.;]\s/).some(sen => HOLD_RE.test(sen) && (!all.length || all.some(n => sen.includes(n))));
}
const suggestStatus = (txt, cur, issue) => holdFor(txt, issue) ? "HOLD" : HOLD_RE.test(txt) ? cur : (CLOSE_RE.test(txt) && !/(נדרש|יש ל|טרם|יועבר|יבוצע|בתהליך|ממתינים)/.test(txt)) ? "סגור" : (cur === "פתוח" ? "בטיפול" : cur);


/** עדכון אוטומטי מהסיכום — עם דוח, שחזור בלחיצה, ואפשרות לעבור לאישור ידני */
const ACTION_RE = /(נדרש|יש ל|טרם|ממתינים|בטיפול|HOLD|לבדיקה|יבדק|יועבר|מבקשים|על הקבלן|יפעל)/;
async function autoApplySummary({ file, cid, date, units, upd, same, gone, fresh, dup }) {
  const prev = {}, created = [], keep = id => { if (!(id in prev)) prev[id] = RAW.issues[id] ? JSON.parse(JSON.stringify(RAW.issues[id])) : null; };
  const rep = { upd: [], same: [], gone: [], fresh: [], skipped: [] };
  for (const m of upd) {
    keep(m.issue.id); const x = RAW.issues[m.issue.id]; const st = suggestStatus(m.item.text, x.status, x), newer = date >= (x.updated || "");
    await api.update("issues", m.issue.id, { history: { ...(x.history || {}), [newId()]: { date, text: m.item.text } }, notMentioned: null,
      ...(newer ? { last: m.item.text, updated: date, status: st } : {}) });
    rep.upd.push({ t: x.title, from: x.status, to: newer ? st : x.status });
  }
  for (const m of same) { const x = RAW.issues[m.issue.id]; if (date >= (x.updated || "")) { keep(m.issue.id); await api.update("issues", m.issue.id, { updated: date, notMentioned: null }); } rep.same.push({ t: x.title }); }
  for (const m of gone) { const x = RAW.issues[m.issue.id]; if (date > (x.updated || "")) { keep(m.issue.id); await api.update("issues", m.issue.id, { notMentioned: date }); rep.gone.push({ t: x.title }); } }
  for (const u of fresh) {
    if (!ACTION_RE.test(u.text) || list("issues").some(x => x.contractorId === cid && similar(u.text, x.title + " " + (x.last || "")) > 0.6)) { rep.skipped.push({ t: u.title }); continue; }
    const kd = [...numbersIn(u.text).kd].sort((a, b) => b - a);
    const id = await api.add("issues", { contractorId: cid, title: u.title.slice(0, 90), category: guessCat(u.section + " " + u.head), kdFrom: String(kd[0] || ""), kdTo: String(kd[1] || ""), owner: "",
      status: HOLD_RE.test(u.text) ? "HOLD" : "פתוח", opened: date, updated: date, last: u.text, history: { [newId()]: { date, text: u.text } }, source: "summary" });
    created.push(id); rep.fresh.push({ t: u.title });
  }
  const mid = await api.add("meetings", { contractorId: cid, date, file: file.name, units: units.length, auto: true });
  const li = (arr, f) => arr.length ? `<ul class="replist">${arr.map(f).join("")}</ul>` : `<p class="muted small">אין</p>`;
  modal(`<h2>הסיכום מ-${fmtD(date)} עודכן אוטומטית</h2>
    ${dup ? `<p class="pill warn">שים לב: כבר נקלט בעבר סיכום מאותו תאריך.</p>` : ""}
    <div class="row small"><span class="pill ok">${rep.upd.length} נושאים עודכנו</span><span class="pill">${rep.same.length} ללא שינוי</span><span class="pill warn">${rep.gone.length} לא הוזכרו</span><span class="pill">${rep.fresh.length} נושאים חדשים</span></div>
    <h3>עודכנו</h3>${li(rep.upd, r => `<li>${esc(r.t)}${r.from !== r.to ? ` <span class="pill">${esc(r.from)} ← ${esc(r.to)}</span>` : ""}</li>`)}
    <h3>לא הוזכרו בסיכום — סומנו לבדיקה, הסטטוס לא שונה</h3>${li(rep.gone, r => `<li>${esc(r.t)}</li>`)}
    <h3>נפתחו כנושאים חדשים</h3>${li(rep.fresh, r => `<li>${esc(r.t)}</li>`)}
    ${rep.skipped.length ? `<details><summary class="small muted">${rep.skipped.length} סעיפי ביצוע/מידע שלא נפתחו כנושא</summary>${li(rep.skipped, r => `<li class="small">${esc(r.t)}</li>`)}</details>` : ""}
    <p class="small muted">כל עדכון נשמר בהיסטוריה של הנושא, ואפשר לערוך אותו בטבלה כרגיל.</p>
    <div class="row"><button class="btn" id="mNo">סגירה</button><span class="spacer"></span>
      <button class="btn ghost" id="mManual">ביטול ומעבר לאישור ידני</button><button class="btn del" id="mUndo">ביטול כל העדכונים</button></div>`,
    (m, close) => {
      m.querySelector(".card").classList.add("wide");
      m.querySelector("#mNo").onclick = close;
      const undo = async () => { for (const [id, v] of Object.entries(prev)) await api.put("issues", id, v); for (const id of created) await api.remove("issues", id); await api.remove("meetings", mid); };
      m.querySelector("#mUndo").onclick = async () => { close(); await undo(); alertModal("כל העדכונים מהסיכום בוטלו.", "בוטל"); };
      m.querySelector("#mManual").onclick = async () => { close(); await undo(); const cfg = RAW.tableConfig?.issues || {};
        RAW.tableConfig.issues = { ...cfg, autoSummary: false }; try { await importSummary(file, cid); } finally { RAW.tableConfig.issues = cfg; } };
    });
}

async function importSummary(file, cid) {
  let lines;
  try { lines = await fileToLines(file); } catch (e) { return alertModal("לא הצלחתי לקרוא את הקובץ: " + (e.message || e)); }
  const text = lines.join("\n"), units = splitItems(lines);
  if (units.length < 3) return alertModal("לא נמצאו סעיפים בקובץ. ייתכן שזה מסמך סרוק (תמונה) — שלח אותו אליי ואחלץ ממנו ידנית.");
  const date = meetingDate(text, file.name) || todayStr();
  const issues = list("issues").filter(x => x.contractorId === cid);
  const { matched, fresh } = analyzeSummary(issues, units);
  const upd = matched.filter(m => m.item && similar(m.item.text, m.issue.last) <= 0.7);
  const same = matched.filter(m => m.item && similar(m.item.text, m.issue.last) > 0.7);
  const gone = matched.filter(m => !m.item);
  const dup = list("meetings").some(m => m.contractorId === cid && m.date === date);
  if (RAW.tableConfig?.issues?.autoSummary !== false) return autoApplySummary({ file, cid, date, units, upd, same, gone, fresh, dup });
  const stSel = (id, v) => `<select class="inp" data-k="${id}" data-f="status">${ISSUE_STATUS.map(s => `<option ${s === v ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  const row = (id, on, title, body, status, extra = "") => `<div class="sumrow" data-k="${id}">
      <label class="row" style="gap:8px;align-items:flex-start"><input type="checkbox" data-k="${id}" data-f="on" ${on ? "checked" : ""}><b style="flex:1">${title}</b>${status}</label>
      ${body}${extra}</div>`;
  const html = `<h2>עדכון נושאים מסיכום פגישה</h2>
    <div class="row small"><span>קובץ: <b>${esc(file.name)}</b></span><label class="row">תאריך הפגישה <input type="date" class="inp" id="sumDate" value="${date}"></label>
      <span class="muted">${units.length} סעיפים נקראו</span></div>
    ${dup ? `<p class="pill warn">כבר נקלט סיכום של פגישה מתאריך זה. עדכונים כפולים ייווספו להיסטוריה.</p>` : ""}
    <p class="small muted" style="margin:4px 0 0">מסומנים מראש רק העדכונים הבטוחים. עוברים, מתקנים טקסט או סטטוס לפי הצורך, ולוחצים "החלת העדכונים".</p>
    <h3>עודכנו בסיכום (${upd.length})</h3>
    ${upd.map(m => row(m.issue.id, true, esc(m.issue.title), `<div class="small muted">היה: ${esc(m.issue.last || "—")}</div><textarea class="inp" rows="2" data-k="${m.issue.id}" data-f="text">${esc(m.item.text)}</textarea>`, stSel(m.issue.id, suggestStatus(m.item.text, m.issue.status, m.issue)))).join("") || `<p class="muted small">אין</p>`}
    <h3>הוזכרו ללא שינוי (${same.length})</h3>
    ${same.map(m => row(m.issue.id, true, esc(m.issue.title), `<div class="small muted">${esc(m.item.text.slice(0, 160))}</div><input type="hidden" data-k="${m.issue.id}" data-f="touch" value="1">`, stSel(m.issue.id, m.issue.status), ` <span class="pill">יעודכן רק תאריך</span>`)).join("") || `<p class="muted small">אין</p>`}
    <h3>לא הוזכרו בסיכום (${gone.length}) — ייתכן שנסגרו</h3>
    ${gone.map(m => row(m.issue.id, false, esc(m.issue.title), `<div class="small muted">מצב אחרון (${fmtD(m.issue.updated)}): ${esc(m.issue.last || "—")}</div><input type="hidden" data-k="${m.issue.id}" data-f="text" value="לא הוזכר בסיכום הפגישה">`, stSel(m.issue.id, "סגור"))).join("") || `<p class="muted small">אין</p>`}
    <h3>סעיפים בסיכום שלא שויכו לנושא (${fresh.length}) — אפשר לפתוח כנושא חדש</h3>
    ${fresh.map((u, i) => { const n = numbersIn(u.text), kd = [...n.kd].sort((a, b) => b - a);
      return row("new" + i, false, `<input class="inp" style="width:100%" data-k="new${i}" data-f="title" value="${esc(u.title.slice(0, 90))}">`,
        `<div class="small muted">${esc(u.text.slice(0, 220))}</div><input type="hidden" data-k="new${i}" data-f="text" value="${esc(u.text)}"><input type="hidden" data-k="new${i}" data-f="cat" value="${esc(guessCat(u.section + " " + u.head))}"><input type="hidden" data-k="new${i}" data-f="kd" value="${kd.slice(0, 2).join("|")}">`,
        stSel("new" + i, "פתוח")); }).join("") || `<p class="muted small">אין</p>`}
    <div class="row" style="position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 2px"><button class="btn" id="mYes">החלת העדכונים</button><button class="btn ghost" id="mNo">ביטול</button><span class="spacer"></span><span class="small muted" id="sumCount"></span></div>`;
  modal(html, (m, close) => {
    m.querySelector(".card").classList.add("wide");
    const cnt = () => { m.querySelector("#sumCount").textContent = `${m.querySelectorAll('input[data-f="on"]:checked').length} פריטים מסומנים`; };
    m.addEventListener("change", cnt); cnt();
    m.querySelector("#mNo").onclick = close;
    m.querySelector("#mYes").onclick = async () => {
      const dt = m.querySelector("#sumDate").value || date, val = (k, f) => m.querySelector(`[data-k="${k}"][data-f="${f}"]`)?.value;
      let n = 0;
      for (const cb of m.querySelectorAll('input[data-f="on"]:checked')) {
        const k = cb.dataset.k, st = val(k, "status"), txt = (val(k, "text") || "").trim();
        if (k.startsWith("new")) {
          const kd = (val(k, "kd") || "").split("|").filter(Boolean);
          await api.add("issues", { contractorId: cid, title: (val(k, "title") || "").trim() || "נושא חדש", category: val(k, "cat"), kdFrom: kd[0] || "", kdTo: kd[1] || "", owner: "", status: st,
            opened: dt, updated: dt, last: txt, history: { [newId()]: { date: dt, text: txt } }, source: "summary" });
        } else {
          const x = RAW.issues[k]; if (!x) continue;
          if (val(k, "touch")) { if (dt >= (x.updated || "")) await api.update("issues", k, { updated: dt, status: st }); }
          else { const newer = dt >= (x.updated || ""); await api.update("issues", k, { history: { ...(x.history || {}), [newId()]: { date: dt, text: txt } }, ...(newer ? { last: txt, updated: dt, status: st } : {}) }); }
        }
        n++;
      }
      await api.add("meetings", { contractorId: cid, date: dt, file: file.name, units: units.length, applied: n });
      close(); alertModal(`עודכנו ${n} פריטים מהסיכום של ${fmtD(dt)}.`, "בוצע");
    };

/* =====================================================================

  iecOrders: { place: true, size: true, excAdvance: true, excAdvanceDate: true, excApproved: true, parentNo: true, budgetNo: true, note: true } };
/** הגדרות עמודות לכל קבלן בנפרד: בדף קבלן נשמרות תחת "<טבלה>__<קבלן>"; קבלן שעוד לא הגדיר — מקבל את ברירת המחדל המשותפת */

const cfgKey = table => ui.page?.startsWith("c:") && PER_CONTRACTOR_TABLES.has(table) ? `${table}__${ui.page.slice(2)}` : table;

  const doc = { ...base, ...patch }; Object.keys(doc).forEach(x => doc[x] === null && delete doc[x]);
  return api.put("tableConfig", k, doc);
}
const hiddenOf = table => tcfg(table).hidden || DEFAULT_HIDDEN[table] || {};
const customOf = table => Object.entries(tcfg(table).custom || {}).map(([id, v]) => ({ id, ...v })).sort(byOrder);

/** תא עריכה: מספרים/ק.ד. — שדה בשורה אחת שמתרחב לתוכן; טקסט — שדה שנשבר לכמה שורות כך שרואים את כל הכתוב */
const cellInput = (col, row, key, cls = "", extra = "") => /num|kdin/.test(cls)
  ? `<input class="cell ${cls}" id="f_${col}_${row.id}_${key}" value="${esc(row[key])}" data-edit="${col}|${row.id}|${key}${cls.includes("num") ? "|n" : ""}" ${extra}>`
  : `<textarea class="cell ${cls}" rows="1" id="f_${col}_${row.id}_${key}" data-edit="${col}|${row.id}|${key}" ${(n => n ? `style="min-width:${n <= 18 ? n + 2 : Math.min(28, Math.ceil(n / 3))}ch"` : "")(String(row[key] ?? "").length)} ${extra}>${esc(row[key])}</textarea>`;
const linkCell = (col, row, key) => { const u = safeUrl(row[key]);
  return `<span class="maplink">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">צפה במפה</a>` : `<span class="empty">אין קישור</span>`}<button data-act="editLink" data-col="${col}" data-id="${row.id}" data-key="${key}" title="עריכת קישור" aria-label="עריכת קישור">✎</button></span>`; };

/** עמודה מותאמת אישית → הגדרת עמודה */
const moneyNum = v => { if (v === "" || v === null || v === undefined) return null; const n = Number(String(v).replace(/[^\d.\-]/g, "")); return isNaN(n) ? null : n; };

}
/** העמודות המוצגות בפועל: קבועות שלא הוסתרו + מותאמות */
/** כל העמודות של טבלה (קבועות + שהוספת) לפי הסדר שנקבע. עמודה בלי מיקום שמור — בסוף, בסדר ברירת המחדל. */
function orderedCols(table, store = table) {

  const ord = tcfg(table).order || [];
  const pos = k => { const i = ord.indexOf(k); return i < 0 ? 1e6 + all.findIndex(c => c.key === k) : i; };
  return all.sort((a, b) => pos(a.key) - pos(b.key));
}

/** כל טבלה באתר נבנית דרך כאן — כך לכל טבלה יש כפתור "עמודות".

  rows = rows.map((r, i) => ({ ...r, _i: i + 1 }));
  const sumCols = cols.filter(c => c.sum);

      || `<tr><td colspan="${cols.length + 1}" class="c muted">${emptyText}</td></tr>`}</tbody>${foot}
  </table></div>`;
}

/* ---------- סינון לפי עמודה (לכל טבלה בנפרד) ----------
   הסינון נעשה על מה שמוצג בתא בפועל — כולל ערכים מחושבים, בחירות מרשימה ותאריכים. */

  const inp = td.querySelector("input:not([type=checkbox]), textarea");
  if (inp) { const v = inp.value || ""; const m = inp.type === "date" && v.match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[3]}/${m[2]}/${m[1].slice(2)} ${v}` : v; }
  const cb = td.querySelector("input[type=checkbox]"); if (cb) return cb.checked ? "כן ✓" : "לא";
  return td.innerText || "";
};
const shownText = td => { const sel = td.querySelector("select"); if (sel) return sel.options[sel.selectedIndex]?.text || "";
  const inp = td.querySelector("input:not([type=checkbox]), textarea"); if (inp) { const m = inp.type === "date" && inp.value.match(/^(\d{4})-(\d\d)-(\d\d)$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : inp.value; }
  return (td.innerText || "").split("\n")[0]; };

  document.querySelectorAll("table.sheet[data-table]").forEach(tb => {

    const rows = [...tb.tBodies[0].rows].filter(tr => !tr.querySelector("td[colspan]"));

    rows.forEach(tr => {
      const ok = keys.every(k => { const td = tr.querySelector(`td[data-k="${CSS.escape(k)}"]`); if (!td) return true;

      const k = dl.id.slice(`dl_${t}_`.length), vals = new Set();
      rows.forEach(tr => { const td = tr.querySelector(`td[data-k="${CSS.escape(k)}"]`); const v = td && shownText(td).trim(); if (v && v.length < 80) vals.add(v); });
      dl.innerHTML = [...vals].sort((a, b) => a.localeCompare(b, "he")).slice(0, 60).map(v => `<option value="${esc(v)}">`).join("");
    });

      ${cols.map((c, i) => `<div class="colrow" draggable="true" data-key="${c.key}">
        <span class="grip" aria-hidden="true">⋮⋮</span>

        ${c.custom ? `<button class="btn del" data-remove="${c.key.slice(2)}">הסרה</button>` : `<span class="pill">קבועה</span>`}
        <button class="mv" data-mv="-1" data-key="${c.key}" ${i === 0 ? "disabled" : ""} aria-label="למעלה">▲</button>
        <button class="mv" data-mv="1" data-key="${c.key}" ${i === cols.length - 1 ? "disabled" : ""} aria-label="למטה">▼</button>
      </div>`).join("")}
    </div>
    <div class="addcol"><b class="small">הוספת עמודה</b>
      <div class="row"><input class="inp" id="ncLabel" placeholder="שם העמודה" style="flex:1;min-width:140px">
      <select class="inp" id="ncType">${COL_TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select>
      <button class="btn" id="ncAdd">הוספה</button></div></div>
    <div class="row"><button class="btn ghost sm" id="mReset">סדר ברירת מחדל</button><span class="spacer"></span><button class="btn ghost" id="mNo">סגירה</button></div>`;
  };
  modal(draw(), (m, close) => {
    const card = m.querySelector(".card");
    const redraw = () => { const y = card.querySelector(".collist")?.scrollTop || 0; card.innerHTML = draw(); wire(); card.querySelector(".collist").scrollTop = y; };
    const keys = () => [...card.querySelectorAll(".colrow")].map(r => r.dataset.key);
    const wire = () => {
      card.querySelector("#mNo").onclick = close;
      card.querySelector("#mReset").onclick = async () => { await setCfg(table, { order: null }); redraw(); };
      card.querySelectorAll("[data-colkey]").forEach(cb => cb.onchange = async () => {
        const h = { ...hiddenOf(table) }; if (cb.checked) delete h[cb.dataset.colkey]; else h[cb.dataset.colkey] = true;
        await setCfg(table, { hidden: Object.keys(h).length ? h : { _none: true } });
      });
      card.querySelectorAll("[data-mv]").forEach(btn => btn.onclick = async () => {
        const k = keys(), i = k.indexOf(btn.dataset.key), j = i + Number(btn.dataset.mv);
        if (j < 0 || j >= k.length) return; [k[i], k[j]] = [k[j], k[i]];
        await saveOrder(table, k); redraw();
      });
      // גרירה
      let dragKey = null;
      card.querySelectorAll(".colrow").forEach(row => {
        row.ondragstart = e => { dragKey = row.dataset.key; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; };
        row.ondragend = () => row.classList.remove("dragging");
        row.ondragover = e => { e.preventDefault(); row.classList.add("over"); };
        row.ondragleave = () => row.classList.remove("over");
        row.ondrop = async e => {
          e.preventDefault(); row.classList.remove("over");
          if (!dragKey || dragKey === row.dataset.key) return;
          const k = keys().filter(x => x !== dragKey); k.splice(k.indexOf(row.dataset.key), 0, dragKey);
          await saveOrder(table, k); redraw();
        };
      });
      card.querySelectorAll("[data-rename]").forEach(inp => inp.onchange = async () => {
        const v = inp.value.trim(); if (!v) return;
        await setCfg(table, { custom: { ...tcfg(table).custom, [inp.dataset.rename]: { ...tcfg(table).custom[inp.dataset.rename], label: v } } });
      });
      card.querySelectorAll("[data-remove]").forEach(btn => btn.onclick = async () => {
        if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "בטוח? הסר"; return; }
        const cus = { ...tcfg(table).custom }; delete cus[btn.dataset.remove];
        await setCfg(table, { custom: Object.keys(cus).length ? cus : null }); redraw();
      });
      const add = async () => {
        const l = card.querySelector("#ncLabel"); if (!l.value.trim()) { l.style.borderColor = "var(--warn)"; l.focus(); return; }
        const cid = newId(), cus = { ...(tcfg(table).custom || {}), [cid]: { label: l.value.trim(), type: card.querySelector("#ncType").value, order: Date.now() } };
        await setCfg(table, { custom: cus }); redraw(); card.querySelector("#ncLabel").focus();
      };
      card.querySelector("#ncAdd").onclick = add;
      card.querySelector("#ncLabel").onkeydown = e => { if (e.key === "Enter") add(); };
    };
    wire();
  });
}

  progress: () => { const d = D(); return [

    { key: "act", label: "מלאכה", cell: p => `<select class="inp" id="f_progress_${p.id}_activityId" data-edit="progress|${p.id}|activityId">${d.activities.filter(a => a.contractorId === p.contractorId).sort(byOrder).map(a => `<option value="${esc(a.id)}" ${a.id === p.activityId ? "selected" : ""}>${esc(a.name)}</option>`).join("")}${d.activities.some(a => a.id === p.activityId) ? "" : `<option selected value="${esc(p.activityId)}">נמחקה</option>`}</select>` },

    { key: "m", label: "מטרים / כמות", cls: "c nowrap", cell: p => isUnitAct(RAW.activities[p.activityId]) ? cellInput("progress", p, "qty", "num", 'style="width:5ch"') + ` יח׳${p.loc ? `<div class="small muted">${esc(p.loc)}</div>` : ""}` : p.secFrom === "" || p.secTo === "" || p.secFrom == null ? "—" : num(Math.abs(p.secTo - p.secFrom) * SECTION_M, 0) },

    { key: "map", label: "מפה", cls: "small nowrap", cell: r => [lk(r.kdFromUrl, "התחלה"), lk(r.kdToUrl, "סוף")].filter(Boolean).join(" · ") || "—" },

    { key: "order", label: "סדר", cls: "w-num", cell: o => cellInput("designOffices", o, "order", "num") },
  ],
  users: () => [
    { key: "name", label: "שם", cell: u => cellInput("users", u, "name") },
    { key: "email", label: "מייל", cls: "small", cell: u => `<span dir="ltr">${esc(u.email)}</span>` },
    { key: "role", label: "תפקיד", cell: u => `<select class="inp" id="f_users_${u.id}_role" data-edit="users|${u.id}|role">${["סופר מנהל", "מנהל", "מתאם", "מתאם איסוף", "מפקח כללי", "מפקח שטח", "לקוח"].map(r => `<option ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}</select>` },
    { key: "active", label: "פעיל", cls: "c", cell: u => `<input type="checkbox" id="f_users_${u.id}_active" ${u.active ? "checked" : ""} data-edit="users|${u.id}|active|b" aria-label="פעיל">` },
  ],
  designSegments: () => [
    { key: "num", label: "מס׳ מקטע", cls: "w-num", cell: s => cellInput("designSegments", s, "num", "num") },

      return c !== null ? `<b>${num(Math.round(c * 1000), 0)}</b>${man && Math.abs(c - man) > 0.1 ? ` <button class="pill warn manlen" data-act="clrManLen" data-id="${s.id}" title="אורך שהוקלד ידנית בעבר. הוא לא בשימוש — החתכים קובעים. לחיצה מוחקת אותו">ידני: ${num(Math.round(man * 1000), 0)} ✕</button>` : ""}`
        : `<input class="cell num" id="f_designSegments_${s.id}_lengthKm" value="${s.lengthKm === "" || s.lengthKm == null ? "" : Math.round(Number(s.lengthKm) * 1000)}" data-edit="designSegments|${s.id}|lengthKm|k" inputmode="numeric" placeholder="מ׳" title="אין חתכים — אורך במטרים"><span class="pill">לפי חתכים — חסר</span>`; } },

/* ---------- קטעי תכנון ---------- */
function pageSegments(d) {
  if (!d.designOffices.length) return `<h1>קטעי תכנון</h1><div class="card"><p>אין עדיין נתונים.</p><button class="btn" data-act="upBackup">טעינת קובץ נתונים</button></div>`;
  const all = d.designSegments;
  const totLen = all.reduce((s, x) => s + (lenOf(x)?.v || 0), 0);
  const mism = 0;
  const noSec = all.filter(x => secLenKm(x) === null).length;

  const block = o => {
    const segs = all.filter(s => s.officeId === o.id);
    const len = segs.reduce((s, x) => s + (lenOf(x)?.v || 0), 0);
    return `<section class="office">
      <div class="office-head" style="background:${esc(o.color || "#eef0eb")}">
        <input class="name oname" id="f_designOffices_${o.id}_name" value="${esc(o.name)}" data-edit="designOffices|${o.id}|name" title="שם המשרד — לחיצה לעריכה" aria-label="שם המשרד">
        <span class="tot">${segs.length} קטעים · ${MTR(len)}</span>
        <span class="spacer"></span>
        <label class="small row" style="gap:4px" title="צבע המשרד">צבע<input type="color" id="f_designOffices_${o.id}_color" value="${esc(o.color || "#eef0eb")}" data-edit="designOffices|${o.id}|color"></label>
        <button class="btn ghost sm" data-act="addSeg" data-office="${o.id}">+ קטע</button>
        <button class="btn del" data-act="delOffice" data-id="${o.id}">מחיקת משרד</button>
      </div>
      ${renderSheet("designSegments", segs, "אין קטעים. לחץ ״+ קטע״.")}
    </section>`;
  };

  return `
  <div class="row" style="margin-bottom:6px"><h1>קטעי תכנון</h1></div>
  <p class="sub">הטבלה ההתחלתית לפי משרד. כל תא ניתן לעריכה ונשמר מיד. כשממלאים חתך התחלה וחתך סוף — האורך מחושב לבד: (חתך סוף − חתך התחלה) × ${SECTION_M} מ׳. שם המשרד והצבע נערכים בכותרת.</p>
  <div class="row" style="margin-bottom:16px; gap:8px">
    <span class="pill">${all.length} קטעים</span><span class="pill">${MTR(totLen)} סה״כ</span>
    ${mism ? `<span class="pill warn">${mism} קטעים עם הפרש בין האורך לחתכים</span>` : ""}
    ${noSec ? `<span class="pill">${noSec} קטעים בלי חתכים</span>` : ""}
  </div>
  ${d.designOffices.map(block).join("")}
  <button class="btn ghost" data-act="addOffice">+ משרד תכנון</button>`;
}

/* ---------- הגדרות ---------- */

  let body;

    contractors: "קבלן, גזרה (ק.ד. מ–עד), חתך התחלה וסוף, שיטת ביצוע",

    ${LOCAL ? "שינויים שאתה עושה נשמרים בינתיים בדפדפן הזה. כדי שיישמרו לכולם: מורידים <b>data.json לפרסום</b> ומעלים אותו ל-GitHub במקום הקובץ הקיים." : "האתר מחובר ל-Firebase, והשינויים נשמרים שם מיד לכל המשתמשים. data.json משמש לגיבוי ולטעינה ראשונה."}</p>

      <span>${c} קבלנים · ${o} הזמנות · ${of} משרדים · ${sg} קטעי תכנון</span>${LOCAL ? (dirty() ? `<span class="pill warn">יש שינויים שלא גובו</span>` : `<span class="pill ok">מגובה</span>`) : ""}</div>
    <div class="backupgrid">
      <div class="bk"><b>הורדת גיבוי</b><span>קובץ עם תאריך ושעה בשם, לשמירה במחשב.</span><button class="btn" data-act="dlBackup">הורדת גיבוי</button></div>
      <div class="bk"><b>הורדת data.json לפרסום</b><span>אותו תוכן בשם data.json, מוכן להעלאה ל-GitHub.</span><button class="btn" data-act="dlPublish">הורדת data.json</button></div>
      <div class="bk"><b>הוספת נתונים מקובץ</b><span>מוסיף רשומות חדשות מקובץ (למשל ייבוא מסיכומי פגישות) בלי למחוק או לשנות שום דבר קיים.</span><button class="btn" data-act="mergeFile">בחירת קובץ…</button></div>

    </div>`; }
  else if (tab[0] === "inspectors") body = inspectorsTab(d);

/* ---------- כפילויות בדיווח ביצוע: אותו קבלן + מלאכה + קטע, חתכים חופפים ---------- */
const ivOfP = p => [Math.min(+p.secFrom, +p.secTo), Math.max(+p.secFrom, +p.secTo)];
const hasSecs = p => p.secFrom !== "" && p.secTo !== "" && p.secFrom != null && p.secTo != null && !isNaN(p.secFrom) && !isNaN(p.secTo);
function progPrior(cid, aid, sid, exceptId) { return list("progress").filter(p => p.id !== exceptId && p.contractorId === cid && p.activityId === aid && p.segmentId === sid && p.review !== "נדחה" && hasSecs(p)); }
function mergeIvs(ivs) { const s = ivs.slice().sort((a, b) => a[0] - b[0]), out = []; for (const [a, b] of s) { const L = out[out.length - 1]; if (L && a <= L[1]) L[1] = Math.max(L[1], b); else out.push([a, b]); } return out; }
function gapsOf(lo, hi, cov) { const g = []; let x = lo; for (const [a, b] of cov) { if (b <= x) continue; if (a >= hi) break; if (a > x) g.push([x, Math.min(a, hi)]); x = Math.max(x, b); if (x >= hi) break; } if (x < hi) g.push([x, hi]); return g; }
function progOverlaps(p) { if (!hasSecs(p)) return []; const [lo, hi] = ivOfP(p); return progPrior(p.contractorId, p.activityId, p.segmentId, p.id).filter(q => { const [a, b] = ivOfP(q); return a < hi && b > lo; }); }
const rngTxt = (a, b) => `<span dir="ltr">${a}–${b}</span>`;

/* ---------- חלונות: אישור מחיקה, עריכת קישור ---------- */
function modal(html, wire) {

  document.body.appendChild(m); m.onclick = e => { if (e.target === m) m.remove(); };
  wire(m, () => m.remove());
}
/** סדר מלאכות: מספר זהה = עבודות במקביל. "להזיז" = הכנסה כשלב N וכל מה שמ-N והלאה זז ב-1; בסוף מסדרים את המספרים ברצף (1,2,3...) */
async function placeActivity(cid, id, N, mode) {
  const acts = list("activities").filter(a => a.contractorId === cid);
  const ord = new Map(acts.map(a => [a.id, Number(a.order) || 0]));
  if (mode === "shift") for (const [k, v] of ord) if (k !== id && v >= N) ord.set(k, v + 1);
  ord.set(id, N);
  const vals = [...new Set(ord.values())].sort((a, b) => a - b), seq = new Map(vals.map((v, i) => [v, i + 1]));
  for (const a of acts) { const nv = seq.get(ord.get(a.id)); if (Number(a.order) !== nv) await api.update("activities", a.id, { order: nv }); }
}
function askActivityOrder(cid, id, N, { isNew = false } = {}) {
  const acts = list("activities").filter(a => a.contractorId === cid && a.id !== id);
  const at = acts.filter(a => Number(a.order) === N).map(a => a.name);
  const last = Math.max(0, ...acts.map(a => Number(a.order) || 0));
  modal(`<h2>${isNew ? "מלאכה חדשה — באיזה שלב?" : `שלב ${N}`}</h2>
    ${isNew ? `<label class="field">מספר שלב<input id="mN" type="number" min="1" value="${last + 1}" style="max-width:120px"></label>` : ""}
    <p class="small" id="mAt">${at.length ? `בשלב ${N} כבר נמצאות: <b>${esc(at.join(", "))}</b>` : ""}</p>
    <div class="row"><button class="btn" id="mShift">להכניס כשלב חדש ולהזיז את השאר (+1)</button><button class="btn ghost" id="mPar">לבצע במקביל לשלב הזה</button><span class="spacer"></span><button class="btn ghost" id="mNo">ביטול</button></div>`,
    (m, close) => {
      const getN = () => isNew ? Math.max(1, Math.round(Number(m.querySelector("#mN").value) || last + 1)) : N;
      const upd = () => { const n = getN(), a = acts.filter(x => Number(x.order) === n).map(x => x.name);
        m.querySelector("#mAt").innerHTML = a.length ? `בשלב ${n} כבר נמצאות: <b>${esc(a.join(", "))}</b>` : `שלב ${n} פנוי`;
        m.querySelector("#mPar").disabled = !a.length; };

      const go = mode => async () => { const n = getN(); close();
        let tid = id; if (isNew) tid = await api.add("activities", { contractorId: cid, name: "מלאכה חדשה", order: n });
        if (!tid) tid = list("activities").filter(a => a.contractorId === cid && a.name === "מלאכה חדשה").pop()?.id;
        if (tid) await placeActivity(cid, tid, n, mode); };

    });
}

function renderLogin(msg = "") {
  $app.innerHTML = `<div class="login"><form class="card" id="loginForm">
    <div><h1>מכשול — בקרת ביצוע</h1><p class="sub" style="margin:0">כניסה למערכת</p></div>
    <label class="field">מייל<input type="email" id="lg_email" dir="ltr" required autocomplete="username"></label>
    <label class="field">סיסמה<input type="password" id="lg_pass" dir="ltr" required autocomplete="current-password"></label>
    <button class="btn">כניסה</button>
    <button type="button" class="btn ghost" id="lg_reset">שכחתי סיסמה</button>
    <div class="small" style="color:var(--warn)">${esc(msg)}</div></form></div>`;
  const em = document.getElementById("lg_email");
  document.getElementById("loginForm").onsubmit = async ev => { ev.preventDefault();
    try { await fb.auth().signInWithEmailAndPassword(em.value.trim(), document.getElementById("lg_pass").value); } catch { renderLogin("מייל או סיסמה שגויים"); } };
  document.getElementById("lg_reset").onclick = async () => {
    if (!em.value) return renderLogin("הקלד מייל ואז לחץ שוב על ״שכחתי סיסמה״");
    try { await fb.auth().sendPasswordResetEmail(em.value.trim()); renderLogin("נשלח מייל לאיפוס סיסמה"); } catch { renderLogin("לא ניתן לשלוח מייל איפוס לכתובת הזו"); } };
}

const loadScript = src => new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
async function start() {
  if (LOCAL) { $app.innerHTML = `<div class="login"><div class="card">טוען נתונים…</div></div>`; await loadLocalMode(); return render(); }
  $app.innerHTML = `<div class="login"><div class="card">טוען…</div></div>`;
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-database-compat.js")]);
  fb = firebase; fb.initializeApp(FIREBASE_CONFIG);
  let off = [];
  fb.auth().onAuthStateChanged(async u => {
    off.forEach(f => f()); off = []; user = u; me = null;
    if (!u) return renderLogin();
    const db = fb.database(), meRef = db.ref(`${DB_ROOT}_access/${u.uid}`);
    // רישום עצמי: מי שנכנס בפעם הראשונה נרשם כ"לא פעיל" עד שמנהל מאשר
    const snap = await meRef.get().catch(() => null);
    if (!snap?.exists()) {   // המשתמש הראשון במערכת הופך אוטומטית ל"סופר מנהל" (הכללים מאפשרים זאת רק כשאין עוד אף משתמש)
      const base = { email: u.email, name: u.email.split("@")[0], createdAt: new Date().toISOString() };
      await meRef.set({ ...base, role: "סופר מנהל", active: true }).catch(() => meRef.set({ ...base, role: "מפקח שטח", active: false }).catch(() => {}));
    }
    let bound = false;
    const cbMe = meRef.on("value", s => {
      const v = s.val(); me = v?.active ? v : null;
      if (me && !bound) {
        bound = true;
        const root = db.ref(DB_ROOT), acc = db.ref(`${DB_ROOT}_access`);
        const c1 = root.on("value", async s2 => {
          const v2 = s2.val();
          // Firebase ריק — טוענים גיבוי ידנית: הגדרות ← נתונים וגיבוי ← טעינת גיבוי
          for (const c of DATA_COLS) RAW[c] = (v2 || {})[c] || {};

        });

        off.push(() => root.off("value", c1), () => acc.off("value", c2));
      }
      render();
    });
    off.push(() => meRef.off("value", cbMe));
  });
}
